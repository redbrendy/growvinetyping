  const sortedByRate = [...members].sort((a,b)=> memberCumulativeRate(b.id)-memberCumulativeRate(a.id));
  const chipsHtml = `<div class="cal-chip ${calFilterId===''?'active':''}" data-id="">전체</div>` +
    (members.length ? `<button type="button" class="cal-chip-more" id="cal-chip-more-btn">멤버별 인증기록 보기 <span class="cal-chip-more-arrow">${calDropdownOpen?'▴':'▾'}</span></button>` : '');
  const dropdownHtml = calDropdownOpen ? `
    <div class="cal-member-dropdown" id="cal-member-dropdown">
      <div class="cal-dropdown-label">전체 멤버 (누적성공률 순)</div>
      ${sortedByRate.map(m=>`<div class="cal-dropdown-row ${calFilterId===m.id?'active':''}" data-id="${m.id}"><span>${m.name}</span><span class="cal-dropdown-pct">${memberCumulativeRate(m.id)}%</span></div>`).join('')}
    </div>` : '';

  let gridHtml = `<div class="cal-wd-row"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div class="cal-grid">`;
  weeks.forEach((w,wi)=>{
    for(let i=0;i<7;i++){
      const d = addDays(w.start,i);
      const ds = fmtDate(d);
      const otherMonth = d.getMonth()!==monthIdx;
      let cls='cal-cell'+(otherMonth?' other-month':'')+(isWeekend(d)?' weekend':'');
      let mark='';
      if(calFilterId){
        const m = members.find(x=>x.id===calFilterId);
        const st = dayStatus(m, ds);
        if(!isFuture(d)){
          cls += ' '+st.code;
          mark = st.leaf ? `<span class="leaf">${st.leaf}</span>` : '';
        }
      } else {
        const ratio = members.length? members.filter(m=>hasCheckin(m.id,ds)).length/members.length : 0;
        if(!isFuture(d)){
          if(ratio===1){ cls+=' perfect'; mark='<span class="leaf">😆</span>'; }
          else if(ratio>0){ cls+=' partial'; mark='<span class="leaf">-</span>'; }
        }
      }
      if(sameDate(d,todayDate)) cls+=' today';
      if(ds===calDetailDate) cls+=' selected';
      gridHtml += `<div class="${cls}" data-date="${ds}">${d.getDate()}${mark}</div>`;
    }
  });
  gridHtml += `</div>`;

  /* 개인별 누적 성공률 (100%에서 확정 결석마다 차감) */
  const cumRows = members.map(m=>{
    const pct = memberCumulativeRate(m.id);
    return `<div class="rank-row">
      <div class="avatar" style="background:${m.color}">${m.name[0]}</div>
      <div class="rank-info"><div class="rank-name">${m.name}</div><div class="rank-bar-track"><div class="rank-bar-fill" style="width:${Math.min(pct,100)}%"></div></div></div>
      <div class="rank-pct">${pct}%</div>
    </div>`;
  }).join('') || `<div class="empty-state"><span class="ic">🌙</span>팀원을 먼저 등록해주세요</div>`;

  let detailHtml = '';
  if(calFilterId){
    /* 개인 선택 시: 목표설정일(미션 시작일)부터 오늘까지 인증 내역을 최신순으로 스크롤 표시 */
    const fm = members.find(x=>x.id===calFilterId);
    if(fm){
      const dayLbls=['일','월','화','수','목','금','토'];
      /* 늦게 합류한 팀원은 등록일부터, 그 외에는 관리자가 정한 미션 시작일부터만 표시 */
      const startD = (fm.registeredAt && parseDate(fm.registeredAt) > periodStartDate()) ? parseDate(fm.registeredAt) : periodStartDate();
      const totalDays = Math.max(0, Math.round((todayDate - startD)/86400000)) + 1;
      let items='';
      for(let i=0;i<totalDays;i++){
        const d = addDays(todayDate, -i);
        const ds2 = fmtDate(d);
        if(isOutsideMission(fm, ds2)) continue; /* 시작일 이전·등록 전·제외기간은 내역에서 제외 */
        const c = getCheckin(fm.id, ds2);
        if(isWeekend(d) && !c) continue; /* 인증 없는 주말은 생략 */
        const st = dayStatus(fm, ds2);
        const lbl = st.label; /* dayStatus가 상황별로 정확한 라벨을 이미 반환하므로 그대로 사용
          (예전엔 code==='pending'이면 무조건 '⏳ 주말대체인증'으로 덮어써서,
           모닝루틴 인증 대기 상태까지 주말대체인증으로 잘못 표시되는 버그가 있었음) */
        const wTime = c && c.wakeupTime && c.wakeupTime!=='보충' ? c.wakeupTime : '';
        const photoBtns = [
          c && c.wakeupPhotoKey ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${c.wakeupPhotoKey}')">📷기상</button>` : '',
          c && c.activityPhotoKey ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${c.activityPhotoKey}')">📷루틴</button>` : ''
        ].filter(Boolean).join(' ');
        items += `<div class="cal-detail-row">
          <div style="flex:1">
            <div style="font-size:17.5px;font-weight:700">${ds2.slice(5)} (${dayLbls[d.getDay()]}) <span style="font-weight:600;font-size:15.5px;color:var(--ink-sub);">${lbl}</span></div>
            <div style="font-size:15.8px;color:var(--ink-sub);margin-top:3px;">${wTime? '기상 '+wTime:''}${c&&c.activityTime? ' · 루틴 '+c.activityTime:''}${photoBtns? ' · '+photoBtns:''}</div>
          </div>
        </div>`;
      }
      detailHtml = `<div class="cal-detail"><div class="section-title" style="margin:0 0 8px;font-size:20.2px;">${fm.name}님 인증 내역 (목표설정일부터 · 최신순)</div><div class="cal-history">${items || '<div class="empty-state"><span class="ic">🌙</span>아직 기록이 없어요</div>'}</div></div>`;
    }
  } else if(calDetailDate){
    if(calDetailDate < settings.periodStart || calDetailDate > settings.periodEnd){
      detailHtml = `<div class="cal-detail"><div class="empty-state"><span class="ic">🌙</span>미션 기간(${settings.periodStart.slice(5)}~${settings.periodEnd.slice(5)}) 밖의 날짜예요</div></div>`;
    } else {
    const isToday = (calDetailDate === todayStr());
    const rows = members.map(m=>{
      const c = getCheckin(m.id, calDetailDate);
      const st0 = dayStatus(m, calDetailDate);
      const isHeld = st0.code==='pending';
      const isOutside = isOutsideMission(m, calDetailDate); /* 늦은 합류 이전이거나 개인 인증제외기간인 날 */
      const wOk = !!(c && (c.wakeupPhotoKey || c.wakeupPhoto));
      const aOk = !!(c && c.activityTime); /* 해빗트래커 인증 완료 여부 */
      const wTime = c && c.wakeupTime && c.wakeupTime!=='보충' ? c.wakeupTime : '';
      const aTime = c && c.activityTime ? c.activityTime : '';
      const makeBtn = (ok, key, time, section)=>{
        if(ok){
          const timeTag = time ? ` · ${time}` : '';
          return key
            ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${key}')">📷 확인${timeTag}</button>`
            : `<span class="verified-tag">✅ 확인${timeTag}</span>`;
        }
        if(isOutside) return `<span class="unverified-tag">해당없음</span>`; /* 미인증이 아니라 애초에 대상이 아닌 날 */
        if(isHeld) return `<span class="unverified-tag" style="background:#F3ECDA;border-color:#D2B36A;color:#86571F;">⏳ 주말대체인증</span>`;
        return isToday
          ? `<button type="button" class="unverified-btn" onclick="goToSection('${m.id}','${section}')">미인증</button>`
          : `<span class="unverified-tag">미인증</span>`;
      };
      const wBtn = makeBtn(wOk, c&&c.wakeupPhotoKey, wTime, 'wakeup');
      const aBtn = makeBtn(aOk, null, aTime, 'activity');
      return `<div class="cal-detail-row">
        <div class="avatar av-sm" style="background:${m.color}">${m.name[0]}</div>
        <div style="flex:1">
          <div style="font-size:18.8px;font-weight:700">${m.name}</div>
          <div style="font-size:16.5px;color:var(--ink-sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;">
            <span>기상인증 ${wBtn}</span><span>모닝루틴 ${aBtn}</span>
          </div>
        </div>
      </div>`;
    }).join('');
    detailHtml = `<div class="cal-detail"><div class="section-title" style="margin:0 0 8px;font-size:20.2px;">${calDetailDate} 상세</div>${rows}</div>`;
    }
  }

  el.innerHTML = `
    <div class="section-title" style="margin-top:6px;">그로우모닝멤버</div>
    <div class="cal-chip-row" id="cal-chip-row">${chipsHtml}</div>
    ${dropdownHtml}
    <div class="cal-nav">
      <button id="cal-prev">‹</button>
      <div class="cal-nav-title">${year}년 ${monthIdx+1}월</div>
      <button id="cal-next">›</button>
    </div>
    ${calFilterId ? (()=>{
      /* 개인 선택 시: 그 멤버의 누적성공률을 달력 위로 끌어올려 표시 */
      const fm = members.find(x=>x.id===calFilterId);
      if(!fm) return '';
      const pct = memberCumulativeRate(fm.id);
      return `<div class="rank-card" style="margin-top:10px;"><div class="rank-row">
        <div class="avatar" style="background:${fm.color}">${fm.name[0]}</div>
        <div class="rank-info"><div class="rank-name">${fm.name} · 누적 성공률</div><div class="rank-bar-track"><div class="rank-bar-fill" style="width:${Math.min(pct,100)}%"></div></div></div>
        <div class="rank-pct">${pct}%</div>
      </div></div>`;
    })() : ''}
    <div class="cal-card-wrap" id="cal-swipe-zone">
      <span class="cal-swipe-arrow left">‹</span>
      <div class="cal-card">${gridHtml}</div>
      <span class="cal-swipe-arrow right">›</span>
    </div>
    ${detailHtml}
    ${!calFilterId ? `
    <div class="section-title" style="margin-top:20px;">누적 성공률 <span class="tag">개인별</span></div>
    <div class="rank-card">${cumRows}</div>` : ''}

    <div class="section-title" style="margin-top:20px;">캘린더 인증안내</div>
    <div class="legend-card">
      <div class="legend-row"><div class="legend-dot" style="background:linear-gradient(135deg,#1F4A3D,#3D6B57)"></div>😆 성공</div>
      <div class="legend-row"><div class="legend-dot" style="background:#B5793D"></div>😴 늦은 기상 (1시간 이내)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#fff;border:1px solid #D8D3C5"></div>❌ 실패</div>
      <div class="legend-row"><div class="legend-dot" style="background:#F3ECDA;border:1px dashed #D2B36A"></div>⏸️ 주말대체 보류</div>
      <div class="legend-row"><div class="legend-dot" style="background:#DDE4DA"></div>✅ 주말대체 완료</div>
    </div>
  `;

  document.querySelectorAll('#cal-chip-row .cal-chip').forEach(c=>{
    c.addEventListener('click', ()=>{ calFilterId=c.dataset.id; calDetailDate=todayStr(); calDropdownOpen=false; renderCalendar(); });
  });
  document.getElementById('cal-chip-more-btn')?.addEventListener('click', ()=>{ calDropdownOpen=!calDropdownOpen; renderCalendar(); });
  document.querySelectorAll('#cal-member-dropdown .cal-dropdown-row').forEach(r=>{
    r.addEventListener('click', ()=>{ calFilterId=r.dataset.id; calDetailDate=todayStr(); calDropdownOpen=false; renderCalendar(); });
  });
  document.getElementById('cal-prev').addEventListener('click', ()=>{ calViewDate=new Date(year,monthIdx-1,1); calDetailDate=null; renderCalendar(); });
  document.getElementById('cal-next').addEventListener('click', ()=>{ calViewDate=new Date(year,monthIdx+1,1); calDetailDate=null; renderCalendar(); });
  const calSwipeZone = document.getElementById('cal-swipe-zone');
  let calTouchX=null, calTouchY=null;
  calSwipeZone.addEventListener('touchstart', e=>{
    calTouchX = e.touches[0].clientX; calTouchY = e.touches[0].clientY;
  }, {passive:true});
  calSwipeZone.addEventListener('touchend', e=>{
    if(calTouchX===null) return;
    const dx = e.changedTouches[0].clientX - calTouchX;
    const dy = e.changedTouches[0].clientY - calTouchY;
    calTouchX = null; calTouchY = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0){ calViewDate=new Date(year,monthIdx+1,1); } else { calViewDate=new Date(year,monthIdx-1,1); }
      calDetailDate=null; renderCalendar();
    }
  }, {passive:true});
  document.querySelectorAll('.cal-cell[data-date]').forEach(c=>{
    c.addEventListener('click', ()=>{ calDetailDate = (calDetailDate===c.dataset.date) ? null : c.dataset.date; renderCalendar(); });
  });
}

/* ===================== Render: Members ===================== */
function renderMembers(){
  const el = document.getElementById('sec-members');
  const activeList = members.filter(m=>!isWithdrawn(m)), keptList = members.filter(isWithdrawn);
  let listHtml = activeList.map(m=>{
    const joinTag = m.registeredAt ? `<div class="mgoal">🗓 등록일 ${m.registeredAt.slice(5)}</div>` : '';
    const exemptTag = (m.exemptStart && m.exemptEnd) ? `<div class="mgoal">🏝 인증제외 ${m.exemptStart.slice(5)}~${m.exemptEnd.slice(5)}</div>` : '';
    return `
    <div class="member-card">
      <div class="avatar av-lg" style="background:${m.color}">${m.name[0]}</div>
      <div><div class="mname">${m.name} ${fdb ? (isParticipant(m.id) ? '<span class="mp-tag">이번 회차 참가</span>' : '<span class="mp-tag grey">미참가</span>') : ''}</div>${joinTag}${exemptTag}</div>
      <div class="mtime">${m.targetTime}</div>
      ${adminMode? `<div class="mactions">
        ${fdb ? `<button class="icon-btn" data-part="${m.id}" title="이번 회차 참가 켜기/끄기">${isParticipant(m.id)?'✅':'➕'}</button>` : ''}
        <button class="icon-btn" data-edit="${m.id}">✎</button>
        <button class="icon-btn" data-del="${m.id}" title="탈퇴 처리 (6개월 보관)">🗑</button>
      </div>`:''}
    </div>`;
  }).join('') || `<div class="empty-state"><span class="ic">🙍</span>팀원을 추가해주세요</div>`;
  if(adminMode && keptList.length){
    listHtml += `<div class="section-title" style="font-size:16px;margin-top:26px;">탈퇴 보관 중 <span class="tag" style="background:#EAEEEC;color:var(--ink-faint);">${keptList.length}명</span></div>
      <p style="font-size:13px;color:var(--ink-faint);margin:-4px 0 6px;line-height:1.6;">기록·쿠폰을 6개월 보관해요. 그 사이 다시 신청(입금확인)하면 기록 그대로 복귀하고, 지나면 자동으로 삭제돼요.</p>` +
      keptList.map(m=>`
      <div class="member-card" style="opacity:.75;">
        <div class="avatar av-lg" style="background:#B9C3C1">${m.name[0]}</div>
        <div><div class="mname">${m.name}</div><div class="mgoal">탈퇴 ${String(m.withdrawnAt).slice(5)} · <b>${m.purgeAfter||''}</b> 삭제 예정</div></div>
        <div class="mactions">
          <button class="icon-btn" data-restore="${m.id}" title="복구">↩</button>
          <button class="icon-btn" data-purge="${m.id}" title="지금 완전 삭제">🗑</button>
        </div>
      </div>`).join('');
  }

  let formHtml = '';
  if(adminMode && (addingMember || editingMemberId)){
    const m = editingMemberId ? members.find(x=>x.id===editingMemberId) : {name:'',targetTime:'06:00',googleEmail:'',color:COLORS[0],exemptStart:'',exemptEnd:'',registeredAt:todayStr()};
    formHtml = `
      <div class="form-card">
        <div class="form-row"><label>이름</label><input id="f-name" value="${m.name}" placeholder="팀원 이름"/></div>
        <div class="form-row"><label>목표 기상 시간</label><input id="f-time" type="time" value="${m.targetTime}"/></div>
        <div class="form-row"><label>로그인 이메일 (구글·네이버 등 신청서에 적은 이메일)</label><input id="f-google-email" value="${m.googleEmail||''}" placeholder="team-member@naver.com"/></div>
        <div class="form-row"><label>색상</label><div class="color-row" id="f-colors">${COLORS.map(c=>`<div class="color-dot ${c===m.color?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div></div>
        <div class="section-title" style="margin:12px 0 6px;font-size:17px;">🗓 팀원등록일</div>
        <p style="font-size:15px;color:var(--ink-faint);margin:-2px 0 8px;">이 날짜부터 누적 성공률에 반영돼요. 늦게 합류한 팀원은 처음부터 있었던 것처럼 불리해지지 않도록, 이 날짜 이전은 계산에서 빠져요.</p>
        <div class="form-row"><label>등록일</label><input id="f-registered" type="date" value="${m.registeredAt||todayStr()}"/></div>
        <div class="section-title" style="margin:12px 0 6px;font-size:17px;">🏝 인증제외기간 (선택)</div>
        <p style="font-size:15px;color:var(--ink-faint);margin:-2px 0 8px;">이 기간에는 팀원 등록은 유지되지만, 인증하지 않아도 누적 성공률 계산에서 제외돼요 (휴가·병가 등)</p>
        <div class="form-row"><label>제외 시작일</label><input id="f-exempt-start" type="date" value="${m.exemptStart||''}"/></div>
        <div class="form-row"><label>제외 종료일</label><input id="f-exempt-end" type="date" value="${m.exemptEnd||''}"/></div>
        <div class="form-actions">
          <button class="btn btn-mini ghost" id="f-cancel" style="flex:1">취소</button>
          <button class="btn btn-mini" id="f-save" style="flex:1">${editingMemberId?'저장':'추가하기'}</button>
        </div>
      </div>`;
  }

  el.innerHTML = `
    <div class="section-title" style="margin-top:6px; justify-content:space-between;">
      <span>팀원 ${members.filter(m=>!isWithdrawn(m)).length}명</span>
      <span style="display:flex;gap:8px;align-items:center;">
        ${adminMode? `<button class="btn btn-mini" id="btn-add-member">+ 추가</button>` : ''}
        <button class="gear-btn" id="btn-admin-toggle" style="width:38px;height:38px;">⚙</button>
      </span>
    </div>
    ${!adminMode? `<div class="admin-banner"><span class="ic">🔒</span><strong>이 페이지는 관리자만 수정할 수 있어요</strong><p style="margin-top:4px;">위의 ⚙ 버튼으로 관리자 모드를 켜주세요</p></div>` : ''}
    ${listHtml}
    ${formHtml}
  `;
  bindAdminToggle();

  if(adminMode){
    document.getElementById('btn-add-member')?.addEventListener('click', ()=>{ addingMember=true; editingMemberId=null; renderMembers(); });
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{ editingMemberId=b.dataset.edit; addingMember=false; renderMembers(); }));
    document.querySelectorAll('#sec-members [data-part]').forEach(b=>b.addEventListener('click', async ()=>{
      const mid = b.dataset.part, m = members.find(x=>x.id===mid); if(!m) return;
      if(!participantsDefined()){
        if(!confirm('이번 회차 참가자를 처음 정하는 거예요.\n지금 팀원 전원을 참가로 먼저 등록한 뒤, 이 팀원을 바꿀게요.')) return;
        await setAllParticipants();
      }
      const on = !isParticipant(mid);
      try{ await setParticipant(mid, on); toast(m.name + (on ? '님을 이번 회차 참가로 등록했어요' : '님을 이번 회차에서 뺐어요')); }
      catch(e){ toast('저장 권한이 없어요'); }
      renderAll();
    }));
    document.querySelectorAll('#sec-members [data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      const target = members.find(m=>m.id===b.dataset.del);
      if(!target) return;
      const msg = `${target.name}님을 탈퇴 처리할까요?\n\n· 팀원 목록과 이번·다음 회차에서 빠져요\n· 인증기록·쿠폰·결제내역은 6개월 동안 보관돼요\n· 그 사이 다시 신청하면 기록 그대로 복귀해요\n· 6개월이 지나면 자동으로 삭제돼요`;
      if(!confirm(msg)) return;
      await withdrawMember(target.id);
      toast(target.name + '님을 탈퇴 처리했어요 (6개월 보관)'); renderAll();
    }));
    document.querySelectorAll('#sec-members [data-restore]').forEach(b=>b.addEventListener('click', async ()=>{
      const target = members.find(m=>m.id===b.dataset.restore); if(!target) return;
      if(!confirm(`${target.name}님을 복구할까요? (이번 회차 참가는 ✅ 버튼으로 따로 켜 주세요)`)) return;
      await restoreWithdrawn(target.id); toast(target.name + '님을 복구했어요'); renderAll();
    }));
    document.querySelectorAll('#sec-members [data-purge]').forEach(b=>b.addEventListener('click', async ()=>{
      const target = members.find(m=>m.id===b.dataset.purge); if(!target) return;
      const msg = `${target.name}님 정보를 지금 완전히 삭제할까요?\n\n⚠️ 인증기록·사진·쿠폰이 모두 삭제되고 되돌릴 수 없어요.\n(결제내역은 금액만 남고 이름·이메일은 지워져요)`;
      if(!confirm(msg)) return;
      await purgeMember(target.id); toast(target.name + '님 정보를 삭제했어요'); renderAll();
    }));
    const colorRow = document.getElementById('f-colors');
    if(colorRow){ colorRow.addEventListener('click', (e)=>{ if(e.target.classList.contains('color-dot')){ colorRow.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel')); e.target.classList.add('sel'); } }); }
    document.getElementById('f-cancel')?.addEventListener('click', ()=>{ addingMember=false; editingMemberId=null; renderMembers(); });
    document.getElementById('f-save')?.addEventListener('click', async ()=>{
      const name=document.getElementById('f-name').value.trim();
      const time=document.getElementById('f-time').value;
      const googleEmail=document.getElementById('f-google-email').value.trim().toLowerCase();
      const color=document.querySelector('#f-colors .color-dot.sel')?.dataset.c || COLORS[0];
      const registeredAt=document.getElementById('f-registered').value || todayStr();
      const exemptStart=document.getElementById('f-exempt-start').value || '';
      const exemptEnd=document.getElementById('f-exempt-end').value || '';
      if(!name||!time||!googleEmail||!googleEmail.includes('@')){ toast('이름·기상시간·로그인 이메일을 정확히 입력해주세요'); return; }
      if(members.some(x=>x.id!==editingMemberId && x.googleEmail && x.googleEmail.toLowerCase()===googleEmail)){ toast('이미 등록된 이메일이에요'); return; }
      if(exemptStart && exemptEnd && parseDate(exemptStart) > parseDate(exemptEnd)){ toast('인증제외 시작일이 종료일보다 늦을 수 없어요'); return; }
      if(editingMemberId){
        const m = members.find(x=>x.id===editingMemberId);
        Object.assign(m,{name,targetTime:time,googleEmail,color,exemptStart,exemptEnd,registeredAt});
      } else {
        members.push({id:'m_'+Date.now(), name,targetTime:time,googleEmail,color,exemptStart,exemptEnd,registeredAt});
      }
      await saveMembers();
      addingMember=false; editingMemberId=null;
      toast('저장됐어요 🌱'); renderAll();
    });
  }
}
function memberEmoji(goal){
  if(/독서|책/.test(goal)) return '📚';
  if(/러닝|운동|헬스|요가|스트레칭/.test(goal)) return '🏃';
  if(/명상/.test(goal)) return '🧘';
  if(/영어|공부|어학/.test(goal)) return '🗣';
  return '🌱';
}

/* ===================== Render: History ===================== */
function renderHistory(){
  const el = document.getElementById('sec-history');
  let list = [...checkins].filter(c=>c.wakeupTime).sort((a,b)=>b.date.localeCompare(a.date));
  if(histFilterMember) list = list.filter(c=>c.memberId===histFilterMember);
  if(histFilterMonth) list = list.filter(c=>c.date.startsWith(histFilterMonth));
  else if(!histShowPast) list = list.filter(c=>c.date>=settings.periodStart && c.date<=settings.periodEnd); /* 새 달이 되면 기록도 새로 시작 (지난 기록은 버튼으로 보기) */

  const memberOpts = teamMembers().map(m=>`<option value="${m.id}" ${histFilterMember===m.id?'selected':''}>${m.name}</option>`).join('');

  const rows = list.map(c=>{
    const m = members.find(x=>x.id===c.memberId);
    if(!m) return '';
    const st = dayStatus(m, c.date);
    const badgeStyle = {perfect:'background:var(--green-dim);color:var(--green)', goalpart:'background:var(--green-dim);color:var(--green)', wakeup:'background:var(--gold-dim);color:#6B4E10', late:'background:#DDE4DA;color:#7A5726', latewake:'background:#EDEAE1;color:var(--ink-sub)', absent:'background:#EAE6DA;color:var(--ink-faint)'}[st.code];
    const histLabel = st.label.replace('부분인증','모닝루틴'); /* 기록 탭 표시 전용 문구 */
    const wakeupPhotoBtn = c.wakeupPhotoKey ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${c.wakeupPhotoKey}')">📷기상</button> ` : (c.wakeupPhoto ? '📷 ' : '');
    const activityPhotoBtn = c.activityPhotoKey ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${c.activityPhotoKey}')">📷루틴</button> ` : (c.activityPhoto ? '📷 ' : '');
    /* 루틴 시각: 인증 확정 시각이 있으면 그걸, 없으면 해빗트래커 마지막 체크 시각 표시 */
    let routineTime = c.activityTime || '';
    if(!routineTime && Array.isArray(c.routineChecks)){
      const times = c.routineChecks.filter(x=>x&&x.time).map(x=>timeToMinutes(x.time)).filter(t=>t!=null);
      if(times.length){ const last=Math.max(...times); routineTime = pad(Math.floor(last/60))+':'+pad(last%60); }
    }
    return `<div class="hist-row">
      <div class="avatar av-sm2" style="background:${m.color}">${m.name[0]}</div>
      <div style="flex:1">
        <div class="hist-top"><span class="hist-name">${m.name}</span><span class="hist-date">${c.date.slice(5)}</span></div>
        <span class="hist-badge" style="${badgeStyle}">${histLabel}</span>
        <div class="hist-memo">${wakeupPhotoBtn}기상 ${c.wakeupTime}${routineTime? ' · 루틴 '+activityPhotoBtn+routineTime:''}${c.memo? ' — '+c.memo:''}</div>
      </div>
      ${adminMode? `<button class="icon-btn hist-edit" data-edit-rec="${c.id}">✎</button><button class="icon-btn hist-del" data-del="${c.id}">🗑</button>`:''}
    </div>
    ${(adminMode && editingRecordId===c.id) ? renderAdminEditCard(c, m) : ''}`;
  }).join('') || `<div class="empty-state"><span class="ic">🔍</span>기록이 없습니다</div>`;

  el.innerHTML = `
    <div class="section-title" style="margin-top:6px; justify-content:space-between;">
      <span>인증 기록</span>
      <span style="font-size:16.5px; color:${adminMode?'var(--green)':'var(--ink-faint)'}; font-weight:700;">${adminMode?'🔓 관리자 모드':'🔒 보기 전용'}</span>
    </div>
    <div class="filter-row">
      <select id="hist-member"><option value="">전체 팀원</option>${memberOpts}</select>
      <input type="month" id="hist-month" value="${histFilterMonth}"/>
    </div>
    ${histFilterMonth ? '' : `<button type="button" class="hist-past-btn" id="hist-past-toggle">${histShowPast ? '이번 챌린지 기록만 보기' : '📂 지난 챌린지 기록도 보기'}</button>`}
    <div id="hist-list">${rows}</div>
  `;
  document.getElementById('hist-past-toggle')?.addEventListener('click', ()=>{ histShowPast = !histShowPast; renderHistory(); });
  document.getElementById('hist-member').addEventListener('change', (e)=>{ histFilterMember=e.target.value; renderHistory(); });
  document.getElementById('hist-month').addEventListener('change', (e)=>{ histFilterMonth=e.target.value; renderHistory(); });
  document.querySelectorAll('#sec-history [data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const target = checkins.find(c=>c.id===b.dataset.del);
    try{
      if(target){
        if(target.wakeupPhotoKey) await deletePhoto(target.wakeupPhotoKey);
        if(target.activityPhotoKey) await deletePhoto(target.activityPhotoKey);
      }
    }catch(e){}
    checkins = checkins.filter(c=>c.id!==b.dataset.del);
    await saveCheckins(); toast('기록과 사진을 삭제했어요'); renderAll();
  }));
  document.querySelectorAll('[data-edit-rec]').forEach(b=>b.addEventListener('click', ()=>{
    editingRecordId = (editingRecordId===b.dataset.editRec) ? null : b.dataset.editRec;
    aeWakePhotoNew = null; aeActPhotoNew = null;
    renderHistory();
  }));
  if(adminMode && editingRecordId) bindAdminEditCard();
}

/* ---- 관리자: 과거 날짜의 사진·모닝루틴 체크 수정 ---- */
function renderAdminEditCard(c, member){
  const goals = memberGoals(member);
  const checks = Array.isArray(c.routineChecks) ? c.routineChecks : [null,null,null];
  const routineRows = goals.map((g,i)=>{
    const ck = checks[i];
    return `<div class="routine-item ${ck&&ck.done?'done':''}">
      <input type="checkbox" class="ae-routine-chk" data-idx="${i}" ${ck&&ck.done?'checked':''}/>
      <span class="routine-goal" style="flex:1;">${g||'(미설정)'}</span>
      <input type="time" class="ae-routine-time" data-idx="${i}" value="${ck&&ck.time?ck.time:''}" style="width:112px;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font-family:inherit;"/>
    </div>`;
  }).join('');
  return `<div class="cert-card" style="margin:8px 0 14px;border:1.5px solid var(--ink);">
    <div class="cert-head"><span class="step-badge" style="background:var(--ink)">✎ 관리자 수정</span><h4>${member.name} · ${c.date}</h4></div>
    <div class="time-field"><label>기상시간</label><input type="time" id="ae-wake-time" value="${c.wakeupTime&&c.wakeupTime!=='보충'?c.wakeupTime:''}"/></div>
    <div class="photo-box" id="ae-wake-photo">${photoPlaceholderHtml('ae-wake','기상 사진 불러오는 중...','')}</div>
    <input type="file" id="ae-wake-input" accept="image/*" hidden/>
    <div class="section-title" style="margin:14px 0 6px;font-size:16px;">모닝루틴 체크 (시간 직접 수정 가능)</div>
    <div id="ae-routine-list">${routineRows}</div>
    <p class="cert-desc" style="margin-top:12px;">📷 모닝루틴 인증사진 (선택)</p>
    <div class="photo-box" id="ae-act-photo">${photoPlaceholderHtml('ae-act','루틴 사진 불러오는 중...','')}</div>
    <input type="file" id="ae-act-input" accept="image/*" hidden/>
    <div class="form-actions">
      <button class="btn btn-mini ghost" id="ae-cancel">취소</button>
      <button class="btn btn-mini" id="ae-save">저장</button>
    </div>
  </div>`;
}
function bindAdminEditCard(){
  const c = checkins.find(x=>x.id===editingRecordId);
  if(!c) return;
  const member = members.find(m=>m.id===c.memberId);
  if(!member) return;

  const wakeBox = document.getElementById('ae-wake-photo');
  const actBox = document.getElementById('ae-act-photo');
  const wakeInput = document.getElementById('ae-wake-input');
  const actInput = document.getElementById('ae-act-input');

  function showPhoto(box, dataUrl, savedKey, label){
    if(dataUrl){ box.innerHTML = photoPreviewHtml(dataUrl); box.querySelector('.photo-remove').addEventListener('click', ()=>{
      if(box===wakeBox) aeWakePhotoNew=null; else aeActPhotoNew=null;
      loadAndShow();
    }); return; }
    if(savedKey){
      loadPhoto(savedKey).then(url=>{
        if(!url){ box.innerHTML = photoPlaceholderHtml('x', label, '사진 없음 · 탭해서 새로 첨부'); bindPh(); return; }
        box.innerHTML = savedPhotoHtml(url);
        box.querySelector('.photo-preview img').addEventListener('click', ()=> openPhotoOverlay(url));
        box.querySelector('.photo-remove').addEventListener('click', async ()=>{
          try{ await deletePhoto(savedKey); }catch(e){}
          if(box===wakeBox){ c.wakeupPhotoKey=null; c.wakeupPhoto=false; } else { c.activityPhotoKey=null; c.activityPhoto=false; }
          toast('사진을 삭제했어요'); loadAndShow();
        });
      });
      return;
    }
    box.innerHTML = photoPlaceholderHtml('x', label, '탭해서 사진 첨부');
    bindPh();
    function bindPh(){ box.querySelector('.photo-placeholder')?.addEventListener('click', ()=> (box===wakeBox?wakeInput:actInput).click()); }
  }
  function loadAndShow(){
    showPhoto(wakeBox, aeWakePhotoNew, c.wakeupPhotoKey, '기상 사진');
    showPhoto(actBox, aeActPhotoNew, c.activityPhotoKey, '루틴 사진');
  }
  loadAndShow();

  wakeInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    toast('사진 압축 중...');
    try{ aeWakePhotoNew = await compressImage(file); loadAndShow(); toast('사진을 불러왔어요 · 저장을 눌러 반영하세요'); }
    catch(err){ toast('사진 처리에 실패했어요'); }
  });
  actInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    toast('사진 압축 중...');
    try{ aeActPhotoNew = await compressImage(file); loadAndShow(); toast('사진을 불러왔어요 · 저장을 눌러 반영하세요'); }
    catch(err){ toast('사진 처리에 실패했어요'); }
  });

  document.getElementById('ae-cancel').addEventListener('click', ()=>{
    editingRecordId=null; aeWakePhotoNew=null; aeActPhotoNew=null; renderHistory();
  });
  document.getElementById('ae-save').addEventListener('click', async ()=>{
    const wt = document.getElementById('ae-wake-time').value;
    c.wakeupTime = wt || c.wakeupTime;
    c.held = false;
    if(!Array.isArray(c.routineChecks)) c.routineChecks = [null,null,null];
    document.querySelectorAll('.ae-routine-chk').forEach(chk=>{
      const i = Number(chk.dataset.idx);
      const timeInput = document.querySelector(`.ae-routine-time[data-idx="${i}"]`);
      const tVal = timeInput ? timeInput.value : '';
      c.routineChecks[i] = chk.checked ? {done:true, time: tVal || (c.routineChecks[i]&&c.routineChecks[i].time) || '00:00'} : null;
    });
    if(aeWakePhotoNew){
      c.wakeupPhotoKey = c.wakeupPhotoKey || ('gt:photo:'+c.id+':wakeup');
      await savePhoto(c.wakeupPhotoKey, aeWakePhotoNew, c.memberId);
      c.wakeupPhoto = true;
    }
    if(aeActPhotoNew){
      c.activityPhotoKey = c.activityPhotoKey || ('gt:photo:'+c.id+':activity');
      await savePhoto(c.activityPhotoKey, aeActPhotoNew, c.memberId);
      c.activityPhoto = true;
    }
    /* 체크/사진을 바탕으로 모닝루틴 인증 시각 재계산 (사진만 있는 경우엔 사진 인증으로 인정) */
    const routineCert = routineCertifiedTime(member, c.date, c.wakeupTime);
    c.activityTime = routineCert || (aeActPhotoNew || c.activityPhoto ? (c.activityTime || nowHM()) : null);
    await saveCheckins();
    editingRecordId=null; aeWakePhotoNew=null; aeActPhotoNew=null;
    toast('수정 내용을 저장했어요 🌱');
    renderAll();
  });
}
function renderAdminPanel(show){
  const panel = document.getElementById('admin-login-panel');
  if(!show){ panel.style.display='none'; panel.innerHTML=''; return; }

  if(!adminMode){
    panel.style.display='block';
    if(currentUserEmail){
      /* 이메일 로그인은 했지만 관리자로 등록된 계정이 아닌 경우 */
      panel.innerHTML = `
        <p style="font-size:17px;color:var(--ink-sub);line-height:1.6;">🔒 <b>${currentUserEmail}</b> 계정은 관리자 권한이 없어요.</p>
        <button class="btn btn-mini ghost" id="admin-logout" style="width:100%;margin-top:8px;">로그아웃</button>`;
      document.getElementById('admin-logout').addEventListener('click', adminLogout);
      return;
    }
    /* 관리자 로그인 폼 (팀원은 이 화면을 볼 필요가 없어요) */
    panel.innerHTML = `
      <p style="font-size:17px;color:var(--ink-sub);">관리자 이메일과 비밀번호로 로그인하세요</p>

      <button class="btn btn-mini" id="admin-login-confirm" style="width:100%;margin-top:10px;">로그인</button>
      <p class="login-error" id="admin-login-error" style="display:none;"></p>`;
    const doAdminLogin = async ()=>{
      const email = document.getElementById('admin-email-input').value.trim();
      const pw = document.getElementById('admin-pw-input').value;
      const errEl = document.getElementById('admin-login-error');
      errEl.style.display='none';
      if(!email || !pw){ errEl.textContent='이메일과 비밀번호를 입력해주세요'; errEl.style.display='block'; return; }
      try{
        await adminLogin(email, pw);
        toast(adminMode? '관리자 모드 ON 🔓' : '로그인은 됐지만 이 계정은 관리자 권한이 없어요');
        renderAdminPanel(true);
        renderAll();
      }catch(e){
        errEl.textContent = '이메일 또는 비밀번호가 올바르지 않아요';
        errEl.style.display='block';
      }
    };
    document.getElementById('admin-login-confirm').addEventListener('click', doAdminLogin);
    document.getElementById('admin-pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doAdminLogin(); });
    return;
  }
  panel.style.display='block';

  const emailRows = (settings.adminEmails||[]).map(em=>`
    <div class="admin-email-row">
      <span>${em}${em===currentUserEmail?' (나)':''}</span>
      ${settings.adminEmails.length>1 ? `<button class="icon-btn" data-rm-admin="${em}">✕</button>` : ''}
    </div>`).join('');

  panel.innerHTML = `
    <div class="section-title" style="margin:0 0 10px;font-size:20.2px;">⚙ 챌린지 설정</div>
    <div class="form-row"><label>챌린지 시작일</label><input type="date" id="set-start" value="${settings.periodStart}"/></div>
    <div class="form-row"><label>챌린지 종료일</label><input type="date" id="set-end" value="${settings.periodEnd}"/></div>
    <div class="form-row"><label>기상 지각 기준 (분)</label><input type="number" id="set-grace" min="0" max="60" value="${settings.graceMin}"/></div>
    <p style="font-size:16.5px;color:var(--ink-faint);margin:-2px 0 12px;">💡 팀원 PIN은 '팀원' 탭에서 각 팀원을 수정해 관리해요</p>
    <div class="form-actions">
      <button class="btn btn-mini ghost" id="set-close" style="flex:1">닫기</button>
      <button class="btn btn-mini" id="set-save" style="flex:1">저장</button>
    </div>

    <div class="section-title" style="margin:16px 0 8px;font-size:18px;">👤 관리자 계정</div>
    <p style="font-size:15.5px;color:var(--ink-faint);margin:-2px 0 10px;">아래 이메일로 로그인한 사람만 관리자 기능을 쓸 수 있어요. 추가한 관리자는 그 이메일로 <b>로그인 링크</b>를 받거나 <b>구글 계정</b>으로 로그인하면 돼요 (보안상 인증된 이메일만 인정).</p>
    <div id="admin-email-list">${emailRows}</div>
    <div class="pin-row">
      <input type="email" id="new-admin-email" class="pin-input" placeholder="추가할 이메일" style="flex:0 0 65%;"/>
      <button class="btn btn-mini" id="add-admin-email">추가</button>
    </div>

    <button class="btn btn-mini ghost" id="admin-logout" style="width:100%;margin-top:14px;">🔓 로그아웃</button>
  `;
  document.getElementById('set-close').addEventListener('click', ()=> renderAdminPanel(false));
  document.getElementById('admin-logout').addEventListener('click', adminLogout);
  document.querySelectorAll('[data-rm-admin]').forEach(b=>b.addEventListener('click', async ()=>{
    const target = b.dataset.rmAdmin;
    if(target===currentUserEmail && !confirm('본인 계정을 관리자에서 제외하면 다시 로그인해도 관리자 화면을 볼 수 없어요. 계속할까요?')) return;
    settings.adminEmails = settings.adminEmails.filter(e=>e!==target);
    await saveSettings();
    adminMode = settings.adminEmails.includes(currentUserEmail);
    toast('관리자 계정에서 제외했어요');
    renderAdminPanel(adminMode);
    renderAll();
  }));
  document.getElementById('add-admin-email').addEventListener('click', async ()=>{
    const v = document.getElementById('new-admin-email').value.trim().toLowerCase();
    if(!v || !v.includes('@')){ toast('올바른 이메일을 입력해주세요'); return; }
    if(settings.adminEmails.includes(v)){ toast('이미 등록된 이메일이에요'); return; }
    settings.adminEmails = [...(settings.adminEmails||[]), v];
    await saveSettings();
    toast('관리자로 추가했어요. 그 이메일 계정이 Firebase에도 있어야 로그인할 수 있어요');
    renderAdminPanel(true);
  });
  document.getElementById('set-save').addEventListener('click', async ()=>{
    const s = document.getElementById('set-start').value;

/* 다음 회차: 관리자가 정해 둔 일정 → 없으면 다음 달 1일~말일 */
function nextRound(){
  const np = settings.nextPeriod;
  if(np && np.start && np.start > todayStr()) return { start: np.start, end: np.end || np.start, applyStart: np.applyStart || '' };
  return null; /* 관리자가 다음 회차를 정하기 전에는 신청을 받지 않아요 */

function applyOpen(nr){ return !!nr && (!nr.applyStart || todayStr() >= nr.applyStart); }
function md_(ds){ return ds ? Number(ds.slice(5,7)) + '/' + Number(ds.slice(8,10)) : ''; }

function couponDiscount(c, price){
  if(!c) return 0;
  if(c.type==='percent') return Math.min(price, Math.floor(price * Number(c.value) / 100 / 100) * 100); // 100원 단위 내림
  return Math.min(price, Number(c.value)||0);
}
function couponText(c){ return c.type==='percent' ? c.value+'%' : wonFmt(c.value); }
/* 쿠폰 중복 사용 규칙: 일반 쿠폰은 한 번에 1장만, 보너스 쿠폰(bonus:true)만 다른 쿠폰과 함께 쓸 수 있어요 */
function isBonus(c){ return !!(c && c.bonus===true); }
function payCouponIds(p){ return [p.couponId].concat(Object.keys(p.bonusIds||{})).filter(Boolean); }
function totalDiscount(list, price){ return Math.min(price, (list||[]).reduce((s,c)=>s+couponDiscount(c, price), 0)); }
function bonusTag(c){ return isBonus(c) ? ' <span class="mp-tag gold">보너스 · 함께 사용 가능</span>' : ''; }
function memberNameById(id){ const m = members.find(x=>x.id===id); return m ? m.name : '(삭제된 팀원)'; }

/* 쿠폰 상태: 결제내역을 보고 계산 (회원이 쿠폰 데이터를 직접 고칠 필요가 없게) */
function couponState(c){
  if(c.status==='used') return 'used';
  if(c.status==='reserved') return 'reserved'; /* 서버가 신청 확인 후 '입금 대기'로 잠가둔 쿠폰 */
  const pay = payments.find(p=>payCouponIds(p).includes(c.id) && (p.status==='wait' || p.status==='paid'));
  if(pay) return pay.status==='paid' ? 'used' : 'reserved';
  if(c.expires && c.expires < todayStr()) return 'expired';
  return 'available';
}
function couponUsable(c){ return couponState(c)==='available'; }
/* 지난 챌린지 기간의 최종 성공률을 그 기간 기준으로 계산 */
function pastPeriodRate(memberId, start, end){
  const s0 = settings.periodStart, e0 = settings.periodEnd;
  try{ settings.periodStart = start; settings.periodEnd = end; return memberCumulativeRate(memberId); }
  catch(e){ return '-'; }
  finally{ settings.periodStart = s0; settings.periodEnd = e0; }
}

/* ===================== 기존 데이터 → 보안 구조로 옮기기 (관리자, 1회) =====================
   예전 growtime/ 아래 데이터를 gm/ 아래 새 구조로 복사해요. 예전 데이터는 지우지 않고
   (관리자만 볼 수 있게 잠긴 채로) 그대로 보관돼요. 예전 사진은 옮기지 않고 그 자리에서 계속 보여요. */
async function migrateFromV1(){
  if(!fdb || !adminMode) return;
  if(!confirm('기존 데이터를 새 보안 구조로 옮길까요?\n(기존 데이터는 지우지 않고 그대로 보관돼요)')) return;
  toast('데이터를 옮기는 중이에요... 잠시만요');
  try{
    const keys = ['gt:members','gt:checkins','gt:settings','coupons','payments','gt:coupons','gt:payments'];
    const vals = await Promise.all(keys.map(k=>fdb.ref('growtime/'+k).get().then(x=>x.exists()?x.val():null).catch(()=>null)));
    const [mV,cV,sV,cpV,pyV,ocV,opV] = vals;
    const parse = v=>{ try{ return typeof v==='string' ? JSON.parse(v) : v; }catch(e){ return null; } };
    const oldMembers = parse(mV) || [];
    const oldCk = parse(cV) || [];
    const oldSettings = Object.assign(defaultSettings(), parse(sV) || {});
    const u = {};
    u['settings'] = JSON.stringify(sanitizeDeep(oldSettings));
    const emails = {};
    oldMembers.forEach((mb,i)=>{
      if(!mb || !mb.id) return;
      const pub = Object.assign({}, mb); delete pub.googleEmail; delete pub.pin; pub.order = i;
      u['members/'+mb.id] = sanitizeDeep(plain(pub));
      const em = String(mb.googleEmail||'').toLowerCase().trim();
      if(em.includes('@')){ emails[mb.id] = em; u['private/'+mb.id] = {googleEmail:em}; u['emailIndex/'+ekeyOf(em)] = mb.id; }
    });
    const by = {};
    (Array.isArray(oldCk)?oldCk:[]).forEach(r=>{ if(r && r.memberId) (by[r.memberId] = by[r.memberId]||[]).push(r); });
    Object.keys(by).forEach(mid=>{ u['checkins/'+mid] = JSON.stringify(by[mid]); });
    const addItems = (node, list)=>{
      (list||[]).forEach(x=>{
        if(!x || !x.id) return;
        const it = sanitizeDeep(plain(Object.assign({}, x, { email: String(x.email || emails[x.memberId] || '').toLowerCase() })));
        if(node==='coupons' && it.status==='reserved') it.status = 'available';
        if(!it.couponId) delete it.couponId;
        delete it.check;
        u[node+'/'+it.id] = it;
      });
    };
    addItems('coupons', cpV ? Object.values(cpV) : []);
    addItems('payments', pyV ? Object.values(pyV) : []);
    addItems('coupons', parse(ocV) || []);
    addItems('payments', parse(opV) || []);
    const admins = {}; admins[ekeyOf(ADMIN_EMAIL)] = true;
    (oldSettings.adminEmails||[]).forEach(e=>{ if(e) admins[ekeyOf(e)] = true; });
    u['admins'] = admins;
    u['meta/migratedAt'] = new Date().toISOString();
    await gref().update(u);
    toast('✅ 옮기기 완료! 새로고침할게요');
    setTimeout(()=>location.reload(), 900);
  }catch(e){ console.error(e); alert('옮기는 중 오류가 났어요: ' + (e.message||e) + '\n이 문구를 그대로 알려주세요.'); }
}

/* ---- 새 달 자동 초기화 ----
   챌린지 종료일이 지나고 새 달이 되면, 챌린지 기간을 '이번 달 1일~말일'로 바꿔요.
   (보안 규칙상 설정 저장은 관리자만 가능 → 회원 폰에서는 화면에만 적용되고,
    관리자가 로그인하면 그때 저장돼요. 결과는 누구 폰이든 똑같이 보여요)
   지난 인증기록은 지우지 않고 보관만 해요. */
function applyAutoPeriod(){
  const today = todayStr();
  const np = settings.nextPeriod;
  let ns = null, ne = null;
  if(np && np.start){
    if(today >= np.start){ ns = np.start; ne = np.end || np.start; }   /* 관리자가 정해 둔 시작일이 됐으면 */
  } else if(settings.monthlyAuto !== false && settings.periodEnd && today > settings.periodEnd){
    const y = todayDate.getFullYear(), m = todayDate.getMonth();       /* 예정이 없으면 매달 1일~말일 */
    ns = fmtDate(new Date(y,m,1)); ne = fmtDate(new Date(y,m+1,0));
  }
  if(!ns) return false;
  if(settings.periodStart === ns){ if(np && np.start===ns){ delete settings.nextPeriod; autoPeriodPending = true; } return false; }
  if(!Array.isArray(settings.pastPeriods)) settings.pastPeriods = [];
  if(settings.periodStart) settings.pastPeriods.push({ start:settings.periodStart, end:settings.periodEnd });
  settings.periodStart = ns; settings.periodEnd = ne;
  delete settings.nextPeriod;
  const d0 = parseDate(ns); calViewDate = new Date(d0.getFullYear(), d0.getMonth(), 1);
  autoPeriodPending = true;
  return true;
}
async function autoMonthlyReset(){
  applyAutoPeriod();
  if(autoPeriodPending && adminMode){ autoPeriodPending = false; await saveSettings(); }
}

    applyHtml = `<div class="mp-status ok">✅ 다음 챌린지(${nrLbl}) 참가 확정! 시작일(${md_(nr.start)})부터 인증할 수 있어요.</div>`;
  }
  const curTag = isWithdrawn(me) ? `<span class="mp-tag grey">탈퇴 보관 중</span>` : isParticipant(me.id) ? `<span class="mp-tag">이번 회차 참가 중</span>` : `<span class="mp-tag grey">이번 회차 미참가</span>`;

  const ps = settings.periodStart, pe = settings.periodEnd;
  let okN=0, lateN=0;
  checkins.filter(c=>c.memberId===me.id && c.date>=ps && c.date<=pe).forEach(c=>{
    const st = dayStatus(me, c.date);
    if(st.code==='perfect') okN++; else if(st.code==='late') lateN++;
  });
  const rate = memberCumulativeRate(me.id);
  const past = (settings.pastPeriods||[]).slice().reverse().filter(p=>p && p.start && p.end && !isBeforeRegistration(me, p.end))
    .map(p=>{ const r = (p.rates && p.rates[me.id]!=null) ? p.rates[me.id] : pastPeriodRate(me.id, p.start, p.end);
      return `<div class="mp-archive-row"><span>${esc(p.start.slice(2).replace(/-/g,'.'))} ~ ${esc(p.end.slice(5).replace('-','.'))}</span><span>최종 성공률 <b>${r}%</b></span></div>`; }).join('');

  const order = {available:0, reserved:1, used:2, expired:3};
  const cpList = myCps.map(c=>({...c, _st: couponState(c)})).sort((a,b)=>order[a._st]-order[b._st]);
  const cpHtml = cpList.length ? cpList.map(c=>`
    <div class="mp-coupon ${c._st}">
      <div class="l"><span class="v">${c.type==='percent'?esc(c.value):(c.value>=1000? (c.value/1000)+'천' : esc(c.value))}</span><span class="u">${c.type==='percent'?'% 할인':'원 할인'}</span></div>
      <div class="r"><div class="n">${esc(c.name)}${bonusTag(c)}</div><div class="d">${c.expires? '~ '+esc(c.expires)+' 까지':'기한 없음'}</div>
        <div style="margin-top:6px;">${c._st==='available'?'<span class="mp-tag coral">사용 가능</span>':c._st==='reserved'?'<span class="mp-tag gold">입금 확인 후 사용 처리</span>':c._st==='used'?'<span class="mp-tag grey">사용 완료</span>':'<span class="mp-tag grey">기간 만료</span>'}</div></div>
    </div>`).join('') : `<div class="mp-card mp-empty">받은 쿠폰이 없어요</div>`;

  const payList = myPays.slice().sort((a,b)=>b.month.localeCompare(a.month));
  const payHtml = payList.length ? payList.map(p=>`
    <div class="mp-pay-row ${p.status==='wait'?'wait':''}">
      <div class="mp-pay-month"><b>${p.round ? md_(p.round) : Number(p.month.slice(5))}</b><span>${p.round ? '시작' : '월'}</span></div>
      <div class="mp-pay-info"><div class="t">${payLabel(p)} 챌린지 ${p.status==='paid'?'<span class="mp-tag">입금확인</span>':'<span class="mp-tag gold">확인 대기</span>'}</div>
        <div class="s">${p.status==='paid'?'입금확인 '+esc(p.paidAt||''):'신청 '+esc(p.appliedAt||'')}${p.couponName?' · 🎟 '+esc(p.couponName):''}</div></div>
      <div class="mp-pay-amt">${p.discount?`<div class="o">${wonFmt(p.price)}</div>`:''}<div class="a">${wonFmt(p.paid)}</div></div>
    </div>`).join('') : `<div class="mp-empty">결제내역이 없어요</div>`;

  return `
    <div class="mp-card">
      <div class="mp-profile">
        <div class="avatar" style="background:${me.color}">${esc(me.name[0])}</div>
        <div style="min-width:0;"><div class="nm">${esc(me.name)}님</div><div class="em">🔐 ${esc(me.googleEmail || currentGoogleEmail || '')}</div></div>
        ${curTag}
      </div>
      ${isWithdrawn(me) ? `<div class="mp-status none" style="margin-top:10px;">📦 탈퇴 후 기록·쿠폰을 <b>${me.purgeAfter}</b>까지 보관 중이에요. 그 전에 다시 신청하면 기록 그대로 복귀해요.</div>` : ''}
      ${applyHtml}
    </div>

    <div class="section-title">이번 챌린지 인증 <span class="tag">${ps.slice(5).replace('-','.')}~${pe.slice(5).replace('-','.')}</span></div>
    <div class="mp-card">
      <div class="mp-stat-row">
        <div class="mp-stat"><div class="v">${okN}</div><div class="l">😆 성공</div></div>
        <div class="mp-stat"><div class="v">${lateN}</div><div class="l">😴 늦은기상</div></div>
        <div class="mp-stat"><div class="v">${rate}<small>%</small></div><div class="l">누적 성공률</div></div>
      </div>
      <p class="mp-note">✨ 매달 챌린지가 새로 시작되면 인증기록은 0부터 다시 시작해요. 결제내역·쿠폰은 그대로 남아요.</p>
      ${past? `<div style="margin-top:10px;">${past}</div>` : ''}
    </div>

    <div class="section-title">내 쿠폰 <span class="tag" style="background:var(--coral-dim);color:var(--coral);">${usable.length}장 사용 가능</span></div>
    ${cpHtml}

    <div class="section-title">월별 결제내역</div>
    <div class="mp-card" style="padding:6px 16px;">${payHtml}</div>`;
}

/* 신청 화면에서 지금 고른 쿠폰들 (일반 1장 + 보너스 여러 장) */
function draftCoupons(me){
  if(!mpDraft) return [];
  const ok = c=>c && c.memberId===me.id && couponUsable(c);
  const n = coupons.find(c=>c.id===mpDraft.couponId && !isBonus(c));
  const b = (mpDraft.bonusIds||[]).map(id=>coupons.find(c=>c.id===id && isBonus(c)));
  return [n].concat(b).filter(ok);
}
function renderMpSheet(me){
  if(!mpDraft) return '';
  const price = challengePrice();
  if(mpSheet==='apply'){
    const usable = coupons.filter(c=>c.memberId===me.id && couponUsable(c));
    const normal = usable.filter(c=>!isBonus(c)), bonus = usable.filter(isBonus);
    const disc = totalDiscount(draftCoupons(me), price);
    const optRow = (c, kind, on)=>`<label class="mp-opt ${on?'sel':''}"><input type="${kind==='b'?'checkbox':'radio'}" name="${kind==='b'?'mp-bcp':'mp-cp'}" value="${esc(c.id)}" ${on?'checked':''}/><span class="n">${esc(c.name)}<br/><span class="d">${c.expires?'~'+esc(c.expires):'기한 없음'}</span></span><span class="v">-${wonFmt(couponDiscount(c,price))}</span></label>`;
    const opts = (normal.length ? `<p class="mp-note" style="margin:4px 0 0;">일반 쿠폰은 <b>1장만</b> 고를 수 있어요.</p>` +
      `<label class="mp-opt ${!mpDraft.couponId?'sel':''}"><input type="radio" name="mp-cp" value="" ${!mpDraft.couponId?'checked':''}/><span class="n">일반 쿠폰 사용 안 함</span></label>` +
      normal.map(c=>optRow(c, 'n', mpDraft.couponId===c.id)).join('') : '') +
      (bonus.length ? `<div class="section-title" style="margin:16px 0 0;font-size:15px;">🎁 보너스 쿠폰 <span style="font-size:12px;color:var(--ink-faint);font-weight:600;">다른 쿠폰과 함께 쓸 수 있어요</span></div>` +
      bonus.map(c=>optRow(c, 'b', (mpDraft.bonusIds||[]).includes(c.id))).join('') : '') +
      (!usable.length ? `<div class="mp-empty">사용할 수 있는 쿠폰이 없어요</div>` : '');
    return `<div class="mp-sheet-bg" id="mp-sheet-bg"><div class="mp-sheet">
      <div class="mp-sheet-head"><h3>${roundLabel(mpDraft.round)} 챌린지 신청</h3><button type="button" class="mp-x" id="mp-x">✕</button></div>
      <div class="mp-steps"><span class="on"></span><span></span></div>
      <div class="section-title" style="margin:18px 0 4px;font-size:16px;">🎟 할인쿠폰 선택</div>
      ${opts}
      <div class="mp-price">
        <div class="ln"><span>챌린지 참가비</span><span class="n">${wonFmt(price)}</span></div>
        <div class="ln disc"><span>쿠폰 할인</span><span class="n">- ${wonFmt(disc)}</span></div>
        <div class="ln total"><span>입금하실 금액</span><span class="n">${wonFmt(price-disc)}</span></div>
      </div>
      <button type="button" class="mp-big-btn" id="mp-to-bank">다음 · 입금 계좌 보기</button>
    </div></div>`;
  }
  if(mpSheet==='bank'){
    const done = !!mpDraft.payId;
    return `<div class="mp-sheet-bg" id="mp-sheet-bg"><div class="mp-sheet">
      <div class="mp-sheet-head"><h3>입금 안내</h3><button type="button" class="mp-x" id="mp-x">✕</button></div>
      <div class="mp-steps"><span class="on"></span><span class="on"></span></div>
      <div class="mp-bank">
        <div class="lb">입금하실 금액</div>
        <div class="amt">${wonFmt(mpDraft.paid)}</div>
        <div style="height:14px"></div>
        <div class="lb">입금 계좌</div>
        <div class="bk">${BANK_INFO.bank} · 예금주 ${BANK_INFO.holder}</div>
        <div class="ac">${BANK_INFO.account}</div>
        <button type="button" class="mp-copy" id="mp-copy">📋 계좌번호 복사</button>
      </div>
      <div class="form-row" style="margin-top:12px;"><label>입금자명 (통장에 찍히는 이름)</label><input id="mp-depositor" value="${esc(mpDraft.depositor)}" ${done?'disabled':''}/></div>
      <p class="mp-note">✔ 입금자명이 다르면 확인이 늦어질 수 있어요.<br/>✔ 관리자가 입금을 확인하면 <b>마이페이지 결제내역</b>에 바로 표시돼요.<br/>✔ 쿠폰은 입금 확인과 함께 사용 처리돼요.</p>
      ${done ? `<button type="button" class="mp-ghost-btn" id="mp-close">닫기</button>`
             : `<button type="button" class="mp-big-btn" id="mp-deposited">입금했어요 · 신청 완료</button><button type="button" class="mp-ghost-btn" id="mp-back">← 쿠폰 다시 고르기</button>`}
    </div></div>`;
  }
  return '';
}

/* ===================== 관리자 영역 (마이 탭 아래쪽) ===================== */
function renderMyPageAdmin(){
  const price = challengePrice();
  const waits = payments.filter(p=>p.status==='wait').sort((a,b)=>(a.appliedAt||'').localeCompare(b.appliedAt||''));
  const waitHtml = waits.length ? waits.map(p=>{
    /* 회원이 보낸 금액이 쿠폰 기준으로 맞는지 관리자 화면에서 한 번 더 확인 */
    const ids = payCouponIds(p), cps = ids.map(id=>coupons.find(c=>c.id===id));
    const expect = price - totalDiscount(cps.filter(Boolean), price);
    let warn = '';
    if(p.check && p.check.ok===false) warn = '⚠️ 서버 확인: ' + esc((p.check.reasons||[]).join(', ')) + (p.check.expected!=null ? ` (정상 금액 ${wonFmt(p.check.expected)})` : '');
    else if(p.check && p.check.ok===true) warn = '';
    else if(cps.some(c=>!c || c.memberId!==p.memberId)) warn = '⚠️ 본인 쿠폰이 아니거나 없는 쿠폰이에요';
    else if(cps.filter(c=>!isBonus(c)).length > 1 || Object.keys(p.bonusIds||{}).some(id=>!isBonus(coupons.find(c=>c.id===id)))) warn = '⚠️ 일반 쿠폰은 1장만 쓸 수 있어요';
    else if(ids.some(id=>payments.some(o=>o.id!==p.id && payCouponIds(o).includes(id) && (o.status==='wait'||o.status==='paid')))) warn = '⚠️ 이미 다른 신청에 쓴 쿠폰이에요';
    else if(Number(p.paid) !== expect) warn = `⚠️ 금액 확인 필요 (정상 금액 ${wonFmt(expect)})`;
    return `<div class="mp-admin-item">
      <div class="i"><div class="t">${esc(memberNameById(p.memberId))} · ${payLabel(p)} 챌린지</div>
        <div class="s">입금액 <b>${wonFmt(p.paid)}</b>${p.couponName?` (🎟 ${esc(p.couponName)} -${wonFmt(p.discount)})`:''}<br/>입금자명 ${esc(p.depositor||'')} · 신청 ${esc(p.appliedAt||'')}</div>
        ${warn?`<div class="s" style="color:var(--danger);font-weight:700;margin-top:3px;">${warn}</div>`:(p.check&&p.check.ok?`<div class="s" style="color:var(--green);font-weight:700;margin-top:3px;">✔ 서버 확인: 금액·쿠폰 정상</div>`:'')}</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button type="button" class="btn btn-mini" data-mp-confirm="${esc(p.id)}">입금확인</button>
        <button type="button" class="btn btn-mini ghost" data-mp-reject="${esc(p.id)}">취소</button>
      </div>
    </div>`;}).join('') : `<div class="mp-empty">확인할 입금이 없어요 👍</div>`;

  const months = [...new Set(payments.filter(p=>p.status==='paid').map(p=>p.month))].sort().reverse();
  if(!mpAdminMonth || !months.includes(mpAdminMonth)) mpAdminMonth = months[0] || '';
  const paidOfMonth = payments.filter(p=>p.status==='paid' && p.month===mpAdminMonth);
  const total = paidOfMonth.reduce((s,p)=>s+Number(p.paid||0),0);
  const monthHtml = months.length ? `
    <select id="mp-admin-month" class="mp-select">${months.map(m=>`<option value="${esc(m)}" ${m===mpAdminMonth?'selected':''}>${m.slice(0,4)}년 ${ymLabel(m)}</option>`).join('')}</select>
    <div class="mp-archive-row" style="border-top:none;"><span>입금 확인 <b>${paidOfMonth.length}명</b></span><span>합계 <b>${wonFmt(total)}</b></span></div>
    ${paidOfMonth.map(p=>`<div class="mp-archive-row"><span>${esc(memberNameById(p.memberId))}${p.couponName?' · 🎟':''}</span><span>${wonFmt(p.paid)}</span></div>`).join('')}`
    : `<div class="mp-empty">아직 입금 확인된 내역이 없어요</div>`;

  const noEmail = members.filter(m=>!m.googleEmail || !m.googleEmail.includes('@'));
  const issued = coupons.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,30).map(c=>{
    const st = couponState(c);
    return `<div class="mp-admin-item">
      <div class="i"><div class="t">${esc(c.name)} <span class="mp-tag coral">${esc(couponText(c))}</span>${isBonus(c)?' <span class="mp-tag gold">보너스</span>':''}</div>
        <div class="s">${esc(memberNameById(c.memberId))} · ${c.expires?'~'+esc(c.expires):'기한 없음'} · ${st==='available'?'미사용':st==='reserved'?'입금 대기':st==='used'?'사용완료':'기간만료'}</div></div>

    </div>`;}).join('');

      <button type="button" class="mp-big-btn coral" id="mp-issue">쿠폰 지급하기</button>
      ${noEmail.length?`<p class="mp-note">⚠️ 로그인 이메일이 없는 팀원(${noEmail.map(m=>esc(m.name)).join(', ')})은 쿠폰을 받아도 볼 수 없어요. 팀원 탭에서 이메일을 먼저 넣어주세요.</p>`:''}

      <p class="mp-note" style="margin-top:0;">시작일 새벽 0시 5분에 자동으로 새 회차가 시작돼요. 인증률은 0부터, 팀원 목록은 그 회차 입금확인된 사람만 보여요.${settings.nextPeriod&&settings.nextPeriod.start ? '' : ' 일정을 저장해야 회원들이 신청할 수 있어요. (비워두면 아래 매달 자동 규칙으로 기간만 바뀌어요)'}</p>
      <div class="form-row"><label>한 회차 참가비 (원)</label><input id="mp-price" type="number" inputmode="numeric" value="${price}"/></div>
      <label class="hold-row" style="margin-top:6px;"><input type="checkbox" id="mp-auto" ${settings.monthlyAuto!==false?'checked':''}/>
        <span><b style="font-size:15px;">다음 회차 예정이 없을 때 매달 자동 시작</b><br/><span class="hold-sub">예정일을 비워두면, 종료일이 지난 뒤 새 달 1일~말일로 자동 시작해요 (지난 기록은 보관)</span></span></label>
      <button type="button" class="mp-big-btn" id="mp-save-settings">저장</button>
    </div>

    <div class="section-title" style="font-size:17px;">지급한 쿠폰 <span class="tag">최근 30장</span></div>
    <div class="mp-card" style="padding:6px 16px;">${issued || '<div class="mp-empty">아직 없어요</div>'}</div>`;
}

function mpFail(e){
  console.error(e);
  const denied = e && /permission/i.test(e.message||e.code||'');
  toast(denied ? '권한이 없어요. 로그인 상태를 확인해주세요' : '저장에 실패했어요. 다시 시도해주세요');
}

function bindMyPage(me){
  const $ = id=>document.getElementById(id);
  $('mp-login')?.addEventListener('click', ()=>{ showLoginGate(); });
  $('mp-install')?.addEventListener('click', ()=>installApp('mp-install-help'));

  /* --- 회원 --- */
  $('mp-apply')?.addEventListener('click', ()=>{
    const usable = coupons.filter(c=>c.memberId===me.id && couponUsable(c));
    const best = usable.filter(c=>!isBonus(c)).sort((a,b)=>couponDiscount(b,challengePrice())-couponDiscount(a,challengePrice()))[0];
    const nr0 = nextRound(); if(!applyOpen(nr0)){ toast('지금은 신청 기간이 아니에요'); return; }
    mpDraft = { round: nr0, couponId: best? best.id : '', bonusIds: usable.filter(isBonus).map(c=>c.id), depositor: me.name };
    mpSheet = 'apply'; renderMyPage();
  });
  $('mp-show-bank')?.addEventListener('click', e=>{
    const p = payments.find(x=>x.id===e.currentTarget.dataset.pay); if(!p) return;
    mpDraft = { round:{ start: payRound(p), end: payRound(p) }, paid:p.paid, depositor:p.depositor||me.name, payId:p.id };
    mpSheet = 'bank'; renderMyPage();
  });
  $('mp-cancel-apply')?.addEventListener('click', async e=>{
    if(!confirm('챌린지 신청을 취소할까요? (이미 입금하셨다면 관리자에게 알려주세요)')) return;
    try{ await mpSetPaymentStatus(e.currentTarget.dataset.pay, 'canceled'); toast('신청을 취소했어요. 사용한 쿠폰은 다시 쓸 수 있어요'); }
    catch(err){ mpFail(err); }
  });
  document.querySelectorAll('input[name=mp-cp]').forEach(r=>r.addEventListener('change', ()=>{ mpDraft.couponId = r.value; renderMyPage(); }));
  document.querySelectorAll('input[name=mp-bcp]').forEach(r=>r.addEventListener('change', ()=>{
    const ids = new Set(mpDraft.bonusIds||[]); if(r.checked) ids.add(r.value); else ids.delete(r.value);
    mpDraft.bonusIds = [...ids]; renderMyPage();
  }));
  const closeSheet = ()=>{ mpSheet=null; mpDraft=null; renderMyPage(); };
  $('mp-x')?.addEventListener('click', closeSheet);
  $('mp-close')?.addEventListener('click', closeSheet);
  $('mp-sheet-bg')?.addEventListener('click', e=>{ if(e.target.id==='mp-sheet-bg') closeSheet(); });
  $('mp-back')?.addEventListener('click', ()=>{ mpSheet='apply'; renderMyPage(); });
  $('mp-to-bank')?.addEventListener('click', ()=>{
    mpDraft.paid = challengePrice() - totalDiscount(draftCoupons(me), challengePrice());
    mpSheet = 'bank'; renderMyPage();
  });
  $('mp-copy')?.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(BANK_INFO.account); toast('계좌번호를 복사했어요'); }
    catch(e){ toast('복사가 안 되면 길게 눌러 복사해주세요: '+BANK_INFO.account); }
  });
  $('mp-deposited')?.addEventListener('click', async ()=>{
    const btn = $('mp-deposited'); btn.disabled = true;
    try{
      const d = mpDraft, price = challengePrice();
      if(payments.some(p=>p.memberId===me.id && payRound(p)===d.round.start && p.status!=='canceled')){
        toast('이미 신청한 달이에요'); mpSheet=null; mpDraft=null; renderMyPage(); return;
      }
      const cp = d.couponId ? coupons.find(c=>c.id===d.couponId && c.memberId===me.id && couponUsable(c) && !isBonus(c)) : null;
      const bcs = (d.bonusIds||[]).map(id=>coupons.find(c=>c.id===id && c.memberId===me.id && couponUsable(c) && isBonus(c)));
      if((d.couponId && !cp) || bcs.some(x=>!x)){ toast('선택한 쿠폰을 쓸 수 없어요. 다시 골라주세요'); mpSheet='apply'; renderMyPage(); return; }
      const used = [cp].concat(bcs).filter(Boolean);
      const disc = totalDiscount(used, price);
      const pay = { id:newId('pay_'), memberId:me.id, email: fdb ? authEmail() : (me.googleEmail||''),
        month:d.round.start.slice(0,7), round:d.round.start, roundEnd:d.round.end, price, discount:disc, couponName: used.map(c=>c.name).join(' + ').slice(0,100), paid: price-disc,
        depositor: ($('mp-depositor').value || me.name).trim().slice(0,30),
        status:'wait', appliedAt: todayStr(), paidAt:'' };
      if(cp) pay.couponId = cp.id;
      if(bcs.length){ pay.bonusIds = {}; bcs.forEach(c=>{ pay.bonusIds[c.id] = true; }); }
      if(fdb && !pay.email){ toast('구글 로그인이 필요해요'); btn.disabled=false; return; }
      mpSheet=null; mpDraft=null;
      await mpPutPayment(pay);
      toast('신청 완료! 입금 확인을 기다려주세요 ⏳');
      renderMyPage();
    }catch(e){ mpFail(e); btn.disabled=false; }
  });

  /* --- 관리자 --- */
  if(!adminMode) return;
  document.querySelectorAll('[data-mp-confirm]').forEach(b=>b.addEventListener('click', async ()=>{
    const p = payments.find(x=>x.id===b.dataset.mpConfirm); if(!p) return;
    try{
      await mpPatchPayment(p.id, { status:'paid', paidAt: todayStr() });
      await setParticipant(p.memberId, true, payRound(p)); /* 그 회차 참가 확정 */
      if(await restoreWithdrawn(p.memberId)) toast(memberNameById(p.memberId)+'님이 탈퇴 보관에서 복귀했어요');
      for(const cid of payCouponIds(p)){ if(coupons.some(c=>c.id===cid)) await mpPatchCoupon(cid, { status:'used', usedPayId:p.id }); }
      toast(memberNameById(p.memberId)+'님 입금 확인 ✅ 결제내역에 표시됐어요');
    }catch(e){ mpFail(e); }
  }));
  document.querySelectorAll('[data-mp-reject]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('이 신청을 취소할까요? 사용한 쿠폰은 회원에게 다시 돌려줘요')) return;
    try{ await mpPatchPayment(b.dataset.mpReject, { status:'canceled' }); toast('신청을 취소했어요'); }catch(e){ mpFail(e); }
  }));
  document.querySelectorAll('[data-mp-revoke]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('이 쿠폰을 회수할까요?')) return;
    try{ await mpRemoveCoupon(b.dataset.mpRevoke); toast('쿠폰을 회수했어요'); }catch(e){ mpFail(e); }
  }));
  $('mp-admin-month')?.addEventListener('change', e=>{ mpAdminMonth = e.target.value; renderMyPage(); });
  $('mp-issue')?.addEventListener('click', async ()=>{
    const target = $('mp-cp-target').value;
    const name = $('mp-cp-name').value.trim().slice(0,40);
    const type = $('mp-cp-type').value;
    const value = Number($('mp-cp-value').value);
    const expires = $('mp-cp-exp').value;
    const bonus = !!$('mp-cp-bonus')?.checked;
    if(!name || !(value>0)){ toast('쿠폰 이름과 할인 값을 입력해주세요'); return; }
    if(type==='percent' && value>100){ toast('할인 비율은 100% 이하로 입력해주세요'); return; }
    if(type==='amount' && value>challengePrice()){ toast('할인 금액이 참가비보다 커요'); return; }
    const owners = target==='all' ? members.filter(m=>!isWithdrawn(m)) : members.filter(m=>m.id===target);
    try{
      for(const m of owners){
        if(fdb && !(m.googleEmail||'').includes('@')) continue; /* 이메일 없는 팀원은 쿠폰을 볼 수 없어서 건너뜀 */
        await mpPutCoupon({ id:newId('cp_'), memberId:m.id, email:(m.googleEmail||'').toLowerCase(),
          name, type, value, expires, bonus, status:'available', createdAt: todayStr() });
      }
      toast(`${target==='all'?'전체 팀원('+owners.length+'명)':memberNameById(target)+'님'}에게 쿠폰을 지급했어요 🎟`);
    }catch(e){ mpFail(e); }
  });
  $('mp-part-all')?.addEventListener('click', async ()=>{
    if(!confirm('지금 등록된 팀원 ' + members.length + '명 전원을 이번 회차 참가자로 설정할까요?')) return;
    try{ await setAllParticipants(); toast('전원을 이번 회차 참가로 설정했어요'); }catch(e){ mpFail(e); }
    renderAll();
  });
  $('mp-save-settings')?.addEventListener('click', async ()=>{
    const price = Number($('mp-price').value);
    if(!(price>0)){ toast('참가비를 입력해주세요'); return; }
    const ns = $('mp-next-start').value, ne = $('mp-next-end').value;
    if(ns || ne){
      if(!ns || !ne){ toast('다음 회차 시작일과 종료일을 모두 입력해주세요'); return; }
      if(ns > ne){ toast('시작일이 종료일보다 늦을 수 없어요'); return; }
      if(ns <= (settings.periodStart||'')){ toast('다음 회차 시작일은 지금 회차 시작일 이후여야 해요'); return; }
      const as = $('mp-apply-start').value;
      if(as && as > ns){ toast('신청 시작일은 회차 시작일보다 앞이어야 해요'); return; }
      settings.nextPeriod = { start: ns, end: ne };
      if(as) settings.nextPeriod.applyStart = as;
    } else { delete settings.nextPeriod; }
    settings.challengePrice = price;
    settings.monthlyAuto = $('mp-auto').checked;
    if(applyAutoPeriod()) toast('시작일이 오늘이라 새 회차를 바로 시작했어요');
    await saveSettings(); saveLocalCache();
    toast('저장했어요 🌱'); renderMyPage();
  });
}

/* ===================== Tabs ===================== */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  activeTab = tab;
  document.getElementById('sec-'+activeTab).classList.add('active');
  document.getElementById('hero-card').style.display = (tab==='checkin') ? '' : 'none';
  if(tab!=='checkin'){ document.body.style.overflow = ''; releaseScreenOn(); } /* 전체화면 타이머 때문에 다른 탭 스크롤이 막히던 문제 */
  if(tab==='checkin'){ resetHeroWeekToToday(); renderHero(); }
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

/* ===================== Boot ===================== */
function renderAll(){
  if(heroWeekIdx===null) heroWeekIdx = currentWeekIndex();
  renderHero(); renderDashboard(); renderCheckin(); renderCalendar(); renderMembers(); renderHistory();
  if(!mpSheet) renderMyPage();
}
/* 재방문 시, 최신 데이터를 기다리는 동안 마지막으로 봤던 화면을 먼저 보여주고
   뒤에서 조용히 최신 데이터로 갱신해요 (첫 방문엔 캐시가 없어서 그냥 평소대로 로딩) */
const LOCAL_CACHE_KEY = 'gt-local-cache-v1';
function tryRenderFromLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return false;
    const cached = JSON.parse(raw);
    if(!cached || !cached.members || !cached.checkins || !cached.settings) return false;
    members = cached.members; checkins = cached.checkins; settings = cached.settings;
    calViewDate = new Date(periodStartDate().getFullYear(), periodStartDate().getMonth(), 1);
    restoreCheckinSession();
    renderAll();
    hideBootSkeleton();
    return true;
  }catch(e){ return false; }
}
function saveLocalCache(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({members, checkins, settings})); }catch(e){}
}
async function bootApp(){
  try{
    const shownFromCache = tryRenderFromLocalCache();
    await loadData();
    renderAll();
    hideBootSkeleton();
    saveLocalCache();
    attachLiveSync();
    attachMyPageSync(); /* 마이페이지: 내 쿠폰·결제내역(관리자는 전체) 실시간 연결 */
    if(!firebaseReady){
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:998;background:#F3ECDA;color:#6B4A1F;font-size:16px;font-weight:600;text-align:center;padding:10px 14px;border-bottom:1.5px solid #D2B36A;';
      banner.textContent = '⚠️ 아직 Firebase 연결 전이에요 — 지금은 데이터가 새로고침하면 사라져요. 파일 안의 설정 안내를 따라 연결해주세요.';
      document.body.appendChild(banner);
    }
  }catch(e){
    hideBootSkeleton();
    showFatalError('앱 실행 중 오류: ' + e.message + '<br><br><small style="color:#888;">' + (e.stack||'') + '</small>');
  }
}
function hideBootSkeleton(){
  const el = document.getElementById('boot-skeleton');
  if(el){ el.style.transition='opacity .25s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(), 260); }
}
/* 팀원은 로그인 없이 사용해요. 대신 앱이 조용히 '익명 로그인'을 해서
   Firebase 보안 규칙(auth != null)을 만족시켜요 — 화면에는 아무 것도 뜨지 않아요. */
async function ensureAnonymousSession(){ /* 보안 강화로 익명 로그인은 사용하지 않아요 */ }
/* 관리자 이메일/비밀번호 로그인 (⚙ 패널 안에서만 사용) */
async function adminLogin(email, pw){
  if(!auth) throw new Error('Firebase 연결 전');
  await auth.signInWithEmailAndPassword(email, pw);
  clearLocalCaches();
  location.reload(); /* 관리자 권한은 서버에서 다시 확인해요 */
}
async function adminLogout(){
  try{ if(auth) await auth.signOut(); }catch(e){}
  clearLocalCaches();
  location.reload();
}
/* 다른 앱(카메라·카톡 등)에 다녀와서 화면이 다시 보이면 시간에 따라 달라지는 화면을 새로 그린다
   (구글 로그인은 Firebase가 자동으로 유지해주므로 별도 세션 갱신이 필요 없다) */
function refreshOnReturn(){
  try{
    if(activeTab !== 'checkin') return;
    renderHero();
    /* 인증 폼을 보고 있을 때는 다시 그리지 않아요.
       (사진을 고르러 카메라/갤러리에 다녀오는 사이 화면이 새로 그려지면,
        방금 고른 사진이 화면에 안 보이거나 타이머가 다시 튀어나오는 문제가 있었음) */
    if(checkinStage !== 'form') renderCheckin();
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  setTimeout(refreshOnReturn, 300);
});
window.addEventListener('pageshow', (e)=>{
  if(!e.persisted) return;
  refreshOnReturn();
});

(async function init(){
  if(firebaseReady && auth){
    await new Promise(resolve=>{ const unsub = auth.onAuthStateChanged(()=>{ unsub(); resolve(); }); });
    if(await completeEmailLinkIfAny()) return; /* 메일의 로그인 링크로 들어온 경우 */
    try{ await resolveIdentity(); }catch(e){ console.error(e); }
    if(!myMemberId && !adminMode){ showLoginGate(); return; }
  }
  await bootApp();
  renderGoogleLoginBar();
  if(adminMode && needsMigration) showMigrationBanner();
})();
</script>
