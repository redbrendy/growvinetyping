<style>
  :root{
    /* ── 그로우모닝 리디자인 토큰 ── */
    --bg:#F2F4F2; --paper:#FFFFFF; --ink:#1F2B2F; --ink-sub:#56676C; --ink-faint:#96A3A7;
    --line:#E1E6E4; --coral:#C4704E; --coral-dim:#F7ECE6; --green:#2F5D62; --green-dim:#E3EDEB;
    --gold:#BF9A4C; --gold-dim:#F6F0E1; --grey:#8D999C; --danger:#B04A3E;
    --radius:20px; --shadow:0 1px 2px rgba(30,43,47,.04), 0 10px 28px -14px rgba(30,43,47,.16);
    --font-sans:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; display:flex; justify-content:center; overscroll-behavior-y:contain; word-break:keep-all; overflow-wrap:break-word; }
  .device{ width:100%; max-width:430px; min-height:100vh; min-height:100dvh; background:var(--bg); position:relative; padding-bottom:92px; }

  .app-header{ padding:calc(22px + env(safe-area-inset-top)) 22px 18px; background:linear-gradient(180deg, #EEF2F0 0%, var(--bg) 100%); }
  .header-top{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:11px; background:var(--coral-dim); border-radius:16px; padding:8px 14px 8px 8px; width:100%; box-sizing:border-box;}
  #google-login-bar{margin-left:auto; flex-shrink:0;}
  .google-login-btn{padding:8px 12px; border-radius:20px; border:none; background:var(--green); color:#fff; font-family:inherit; font-size:12px; font-weight:700; white-space:nowrap;}
  .google-login-status{padding:8px 12px; border-radius:20px; border:none; background:#fff; color:var(--green); font-family:inherit; font-size:12px; font-weight:700; white-space:nowrap;}

  .hero-top{display:flex; align-items:flex-end; justify-content:space-between;}

  .legend-card.two-col{ display:grid; grid-template-columns:1fr 1fr; column-gap:14px; row-gap:0; }
  .legend-card.two-col .legend-row{ border-top:none; padding:7px 0; align-items:flex-start; line-height:1.35; word-break:keep-all; overflow-wrap:break-word; min-width:0; }

  .rank-card{background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:6px; margin-top:14px;}

  .rank-pct{font-family:var(--font-num); font-weight:700; font-size:20px;}

  .week-rank-card{background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:6px; margin-top:14px;}
  .week-row{display:flex; align-items:center; gap:10px; padding:11px 9px; border-bottom:1px solid var(--line);}
  .week-row:last-child{border-bottom:none;}

  .pin-modal-backdrop{position:absolute; inset:0; background:rgba(30,43,47,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:5; border-radius:var(--radius);}

  .pin-modal-desc{font-size:14px; color:var(--ink-sub); margin-top:6px; margin-bottom:14px; line-height:1.5; text-align:center; white-space:nowrap;}

  .checkin-back-btn{height:42px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--ink-sub); font-size:16px; font-weight:600; font-family:inherit; display:flex; align-items:center; gap:5px;}

<script>
/* ===================== State ===================== */
const todayDate = new Date();
let members = [];
let checkins = [];
let settings = { graceMin: 5, adminEmails: [], periodStart: null, periodEnd: null, configVersion: 0 };
let coupons = [];   // 할인쿠폰 목록 (gt:coupons)
let payments = [];  // 챌린지 신청·결제 내역 (gt:payments)
let histShowPast = false; // 기록 탭: 지난 챌린지 기록까지 보기
let activeTab = 'checkin';
let heroWeekIdx = null; // null이면 이번 주(현재 주차)로 자동 설정됨
function changeHeroWeek(delta){
  const weeks = periodWeeks();
  if(heroWeekIdx===null) heroWeekIdx = currentWeekIndex();
  heroWeekIdx = Math.max(0, Math.min(weeks.length-1, heroWeekIdx+delta));
  renderHero();
}
/* 오늘인증 탭에 진입할 때마다 오늘 주차로 초기화 */
function resetHeroWeekToToday(){
  heroWeekIdx = currentWeekIndex();
}
let selectedMemberId = null;
let heroVerified = false; // 이 폰에서 PIN 확인을 거쳐 "진짜 본인"으로 확인된 적이 있는지 (없으면 상단 캘린더는 빈 상태로 보여줌)
let wakeupPhotoData = null;
let activityPhotoData = null;
let adminMode = false;
let calViewDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
let calFilterId = '';
let calDetailDate = null;
let checkinStage = 'grid'; // 'grid'(이름 선택) | 'view'(타인 기록 보기, PIN 불필요) | 'form'(오늘인증 폼, 본인 PIN 필요)
let viewingMemberId = null; // 현재 "보기 전용"으로 열람 중인 팀원 id (PIN 없이 조회)
let pinModalMemberId = null; // PIN 확인 팝업이 떠있는 대상 팀원 id (없으면 null)
let pinModalScrollTarget = null; // PIN 확인 후 폼에서 스크롤로 이동할 위치(기상/모닝루틴)
let calDropdownOpen = false; // 캘린더 상단 "더보기" 전체 멤버 목록 펼침 여부
const LAST_MEMBER_KEY = 'gt:lastMemberId'; // 이 폰(브라우저)에서 마지막으로 인증했던 사람 기억용

/* ===================== PIN 인증 유지(3시간) =====================
   PIN을 한 번 맞게 넣으면 이 폰에 "누가 확인됐는지 + 언제까지 유효한지"를 저장해둔다.
   그래서 사진을 올리다가 카메라·카톡 등 다른 앱에 다녀와서 앱이 새로 열려도
   PIN을 다시 묻지 않고 인증 화면을 그대로 이어서 보여준다. */
const PIN_SESSION_KEY = 'gt:pinSession';
const PIN_SESSION_MS = 3 * 60 * 60 * 1000; // 3시간
function savePinSession(memberId){
  try{ localStorage.setItem(PIN_SESSION_KEY, JSON.stringify({id:memberId, exp:Date.now()+PIN_SESSION_MS})); }catch(e){}
}
function getPinSession(){
  try{
    const raw = localStorage.getItem(PIN_SESSION_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.id || !o.exp) return null;
    if(Date.now() > o.exp){ localStorage.removeItem(PIN_SESSION_KEY); return null; }
    return o;
  }catch(e){ return null; }
}
function hasPinSession(memberId){ const s = getPinSession(); return !!(s && s.id === memberId); }
function clearPinSession(){ try{ localStorage.removeItem(PIN_SESSION_KEY); }catch(e){} }
function pinSessionLeftMin(){ const s = getPinSession(); return s ? Math.max(0, Math.round((s.exp - Date.now())/60000)) : 0; }

/* ===================== 구글 로그인으로 본인확인 (PIN 대체) =====================
   팀원의 googleEmail(관리자가 신청서 자동등록 스크립트로 미리 등록해둔 값)과
   로그인한 구글 계정 이메일이 일치하면 "본인"으로 인정한다. */
async function signInWithMemberGoogle(){
  if(!auth){ toast('Firebase 연결 전이라 로그인할 수 없어요'); return null; }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });
    await auth.signInWithPopup(provider);
    clearLocalCaches();
    location.reload(); /* 로그인한 계정 권한으로 처음부터 다시 불러옴 */
  }catch(e){
    if(e && e.code==='auth/popup-closed-by-user') return null;
    toast('구글 로그인에 실패했어요: ' + (e.message||e));
  }
  return null;
}
async function signOutMemberGoogle(){
  try{ if(auth) await auth.signOut(); }catch(e){}
  clearLocalCaches();
  location.reload();
}
function myGoogleMatchedMember(){
  if(fdb) return myMemberId ? (members.find(m=>m.id===myMemberId) || null) : null;
  if(!currentGoogleEmail) return null; /* 미리보기 모드 */
  return members.find(m => m.googleEmail && m.googleEmail.toLowerCase() === currentGoogleEmail) || null;
}
function renderGoogleLoginBar(){
  const el = document.getElementById('google-login-bar');
  if(!el) return;
  if(currentGoogleEmail || currentUserEmail){
    el.innerHTML = `<button type="button" class="google-login-status" id="btn-google-signout">로그아웃</button>`;
    document.getElementById('btn-google-signout').addEventListener('click', signOutMemberGoogle);
  } else {
    el.innerHTML = `<button type="button" class="google-login-btn" id="btn-google-signin">로그인</button>`;
    document.getElementById('btn-google-signin').addEventListener('click', signInWithMemberGoogle);
  }
  try{ if(!mpSheet) renderMyPage(); }catch(e){}
}

function restoreCheckinSession(){
  try{
    const savedId = localStorage.getItem(LAST_MEMBER_KEY);
    if(savedId && members.some(m=>m.id===savedId)){ selectedMemberId = savedId; heroVerified = true; }
  }catch(e){}
  const matched = myGoogleMatchedMember();
  if(matched){
    selectedMemberId = matched.id;
    heroVerified = true;
    checkinStage = 'form'; // 구글 로그인 상태면 다시 로그인 안 물어보고 바로 인증 화면
  }
}
let editingMemberId = null;
let addingMember = false;
let histFilterMember = '';
let histFilterMonth = '';

/* ===================== 🔐 보안 저장 구조 (gm/) =====================
   - gm/settings        : 챌린지 설정 (관리자만 저장)
   - gm/members/<id>    : 팀원 공개정보 (이름·목표시간 등, 이메일 없음) — 본인은 루틴 목표만 수정 가능
   - gm/private/<id>    : 팀원 구글 이메일 (관리자와 본인만 볼 수 있음)
   - gm/emailIndex/...  : 로그인한 이메일 → 팀원 id (본인 것만 조회 가능)
   - gm/checkins/<id>   : 팀원별 인증기록 (본인과 관리자만 저장 가능)
   - gm/photos/<key>    : 인증 사진 + 주인 표시 (본인과 관리자만 저장·삭제)
   - gm/coupons, gm/payments, gm/admins : 마이페이지·관리자
   모든 데이터는 '등록된 팀원 또는 관리자'로 로그인해야만 볼 수 있어요. */
const DBROOT = 'gm';

let lastMemberIds = new Set();
let lastSettingsStr = '', lastMembersStr = '';
function gref(p){ return fdb.ref(p ? DBROOT + '/' + p : DBROOT); }
/* ---- 회차(챌린지 시작일)별 참가자: gm/participants/<시작일>/<팀원id> = true ----
   이번 회차 참가자가 한 명도 정해지지 않았으면(처음 전환할 때) 모두 참가로 봐요. */
let participants = {};
function currentRound(){ return settings.periodStart || ''; }
function roundParticipants(r){ return (participants && participants[r]) || null; }
function participantsDefined(){ return !!roundParticipants(currentRound()); }
function isWithdrawn(m){ return !!(m && m.withdrawnAt); }
function isParticipant(mid){
  const mm = members.find(x=>x.id===mid); if(isWithdrawn(mm)) return false;
  if(!fdb) return true;
  const cur = roundParticipants(currentRound());
  if(!cur) return true;
  return cur[mid] === true;
}
function teamMembers(){ return members.filter(m=>!isWithdrawn(m) && isParticipant(m.id)); }
async function setParticipant(mid, on, round){
  const r = round || currentRound(); if(!r || !mid) return;
  if(!participants[r]) participants[r] = {};
  if(on) participants[r][mid] = true; else delete participants[r][mid];
  if(fdb) await gref('participants/'+r+'/'+mid).set(on ? true : null);
}
async function setAllParticipants(){
  const r = currentRound(); const map = {};
  members.filter(m=>!isWithdrawn(m)).forEach(m=>{ map[m.id] = true; });
  participants[r] = map;
  if(fdb) await gref('participants/'+r).set(map);
}
function ekeyOf(email){ return String(email||'').toLowerCase().trim().replace(/\./g, ','); }
/* 화면에 그대로 찍히는 글자에서 < > " ' ` 를 빼서, 누군가 악성 코드를 이름·메모에 넣어도 실행되지 않게 함 */
function cleanText(v){ return typeof v==='string' ? v.replace(/[<>"'`]/g,'') : v; }
function sanitizeDeep(o){
  if(Array.isArray(o)) return o.map(sanitizeDeep);
  if(o && typeof o==='object'){ const r={}; for(const k in o) r[k]=sanitizeDeep(o[k]); return r; }
  return cleanText(o);
}
function plain(o){ return JSON.parse(JSON.stringify(o)); } // undefined 제거 (Firebase 저장용)
function membersFromVal(val){
  const arr = Object.values(val||{}).filter(m=>m && m.id).map(m=>{
    const x = sanitizeDeep(m);
    if(x.goals && !Array.isArray(x.goals)) x.goals = [x.goals[0]||'', x.goals[1]||'', x.goals[2]||''];
    if(privateEmails[x.id]) x.googleEmail = privateEmails[x.id];
    return x;
  });
  arr.sort((a,b)=> ((a.order??1e9)-(b.order??1e9)) || String(a.id).localeCompare(String(b.id)));
  lastMemberIds = new Set(arr.map(m=>m.id));
  return arr;
}
function checkinsFromVal(val){
  const out = []; lastCk = {};
  Object.keys(val||{}).forEach(mid=>{
    const str = val[mid]; lastCk[mid] = str;
    let arr = []; try{ arr = JSON.parse(str); }catch(e){}
    (Array.isArray(arr)?arr:[]).forEach(r=>{ if(r && typeof r==='object'){ const x = sanitizeDeep(r); x.memberId = mid; out.push(x); } });
  });
  return out;
}
function privFromVal(val){ const r = {}; Object.keys(val||{}).forEach(id=>{ const e = val[id] && val[id].googleEmail; if(e) r[id] = String(e).toLowerCase(); }); return r; }
function defaultSettings(){
  const y=todayDate.getFullYear(), m=todayDate.getMonth();
  return { graceMin:5, adminEmails:[ADMIN_EMAIL], periodStart:fmtDate(new Date(y,m,1)), periodEnd:fmtDate(new Date(y,m+1,0)), configVersion:4 };
}
/* 로그인한 사람이 누구인지(팀원 id, 관리자 여부)를 서버에서 확인 */
async function resolveIdentity(){
  const u = auth && auth.currentUser;
  if(!u || u.isAnonymous || !u.email) return;
  const email = u.email.toLowerCase();
  const isGoogle = (u.providerData||[]).some(p=>p.providerId==='google.com');
  if(isGoogle) currentGoogleEmail = email; else currentUserEmail = email;
  const ek = ekeyOf(email);
  const [mi, ad] = await Promise.allSettled([gref('emailIndex/'+ek).get(), gref('admins/'+ek).get()]);
  if(mi.status==='fulfilled' && mi.value.exists()) myMemberId = String(mi.value.val());
  if(myMemberId) currentGoogleEmail = email; /* 구글이든 이메일 링크든, 팀원으로 로그인한 이메일 */
  adminMode = (email === ADMIN_EMAIL.toLowerCase()) || (u.emailVerified && ad.status==='fulfilled' && ad.value.val()===true);
}
async function loadDataSecure(){
  const reads = [gref('settings').get(), gref('members').get(), gref('checkins').get()];
  if(adminMode) reads.push(gref('private').get());
  reads.push(gref('participants').get().catch(()=>null));
  const res = await Promise.all(reads);
  const [sS, mS, cS] = res; const pS = adminMode ? res[3] : null; const ptS = res[res.length-1];
  participants = (ptS && ptS.val()) || {};
  if(pS) privateEmails = privFromVal(pS.val());
  needsMigration = !sS.exists();
  lastSettingsStr = sS.exists() ? sS.val() : '';
  try{ settings = sS.exists() ? sanitizeDeep(JSON.parse(sS.val())) : defaultSettings(); }catch(e){ settings = defaultSettings(); }
  lastMembersStr = JSON.stringify(mS.val()||{});
  members = membersFromVal(mS.val());
  checkins = checkinsFromVal(cS.val());
}

/* 다른 사람이 인증을 올리면 내 화면도 자동으로 갱신되는 실시간 동기화 */
function attachLiveSync(){
  if(!fdb) return;
  gref('settings').on('value', s=>{
    if(!s.exists() || s.val()===lastSettingsStr) return;
    lastSettingsStr = s.val();
    try{ settings = sanitizeDeep(JSON.parse(s.val())); needsMigration = false; applyAutoPeriod(); liveRerender(); }catch(e){}
  });
  gref('members').on('value', s=>{
    const str = JSON.stringify(s.val()||{});
    if(str===lastMembersStr) return;
    lastMembersStr = str; members = membersFromVal(s.val()); liveRerender();
  });
  gref('participants').on('value', s=>{
    const v = s.val() || {};
    if(JSON.stringify(v)===JSON.stringify(participants)) return;
    participants = v; liveRerender();
  });
  gref('checkins').on('value', s=>{
    const val = s.val()||{};
    const changed = Object.keys(val).some(k=>val[k]!==lastCk[k]) || Object.keys(lastCk).some(k=>!(k in val));
    if(!changed) return;
    checkins = checkinsFromVal(val); liveRerender();
  });
  if(adminMode) gref('private').on('value', s=>{
    privateEmails = privFromVal(s.val());
    members.forEach(m=>{ m.googleEmail = privateEmails[m.id] || ''; });
    liveRerender();
  });
}

const CONFIG_VERSION = 4;
async function loadData(){
  if(fdb){
    await loadDataSecure();
  } else {
    /* Firebase 연결 전(미리보기) 모드: 예시 데이터로 화면만 보여줌 */
    let mRaw=null, cRaw=null, sRaw=null;
    [mRaw, cRaw, sRaw] = await Promise.all([window.storage.get('gt:members'), window.storage.get('gt:checkins'), window.storage.get('gt:settings')]);
    members = mRaw ? JSON.parse(mRaw.value) : seedMembers();
    checkins = cRaw ? JSON.parse(cRaw.value) : seedCheckins();
    settings = sRaw ? JSON.parse(sRaw.value) : defaultSettings();
  }
  if(!settings.configVersion || settings.configVersion < CONFIG_VERSION){
    const d = defaultSettings();
    if(!settings.periodStart) settings.periodStart = d.periodStart;
    if(!settings.periodEnd) settings.periodEnd = d.periodEnd;
    if(!settings.graceMin) settings.graceMin = 5;
    if(!Array.isArray(settings.adminEmails) || settings.adminEmails.length===0) settings.adminEmails = [ADMIN_EMAIL];
    delete settings.adminPw;
    settings.configVersion = CONFIG_VERSION;
    if(!needsMigration) await saveSettings();
  }
  applyAutoPeriod();          /* 새 달이 되면 인증기록(챌린지 기간) 자동 초기화 — 서버(자동 작업)가 저장 */
  calViewDate = new Date(periodStartDate().getFullYear(), periodStartDate().getMonth(), 1);
  restoreCheckinSession();
}
async function saveMembers(){
  if(!fdb){ memoryStore['gt:members'] = JSON.stringify(members); return; }
  try{
    if(adminMode){
      const u = {}, nowIds = new Set();
      members.forEach((m,i)=>{
        nowIds.add(m.id);
        const pub = Object.assign({}, m); delete pub.googleEmail; delete pub.pin;
        pub.order = i;
        u['members/'+m.id] = sanitizeDeep(plain(pub));
        const em = String(m.googleEmail||'').toLowerCase().trim();
        const prev = privateEmails[m.id];
        if(prev && prev!==em) u['emailIndex/'+ekeyOf(prev)] = null;
        if(em.includes('@')){ u['private/'+m.id] = {googleEmail: em}; u['emailIndex/'+ekeyOf(em)] = m.id; }
        else u['private/'+m.id] = null;
      });
      lastMemberIds.forEach(id=>{
        if(nowIds.has(id)) return;
        u['members/'+id] = null; u['private/'+id] = null;
        if(privateEmails[id]) u['emailIndex/'+ekeyOf(privateEmails[id])] = null;
      });
      await gref().update(u);
      privateEmails = {}; members.forEach(m=>{ if(m.googleEmail) privateEmails[m.id] = String(m.googleEmail).toLowerCase(); });
      lastMemberIds = nowIds;
    } else if(myMemberId){
      const me = members.find(m=>m.id===myMemberId); if(!me) return;
      const g = memberGoals(me).map(x=>cleanText(String(x||'')).slice(0,100));
      await gref('members/'+myMemberId).update({ goals:g, goal:g[0]||'' });
    }
  }catch(e){ console.error(e); toast('저장 권한이 없어요. 다시 로그인해주세요'); }
}
async function saveCheckins(){
  if(!fdb){ memoryStore['gt:checkins'] = JSON.stringify(checkins); return; }
  const by = {};
  checkins.forEach(c=>{ if(c && c.memberId) (by[c.memberId] = by[c.memberId] || []).push(c); });
  const updates = {};
  new Set([...Object.keys(by), ...Object.keys(lastCk)]).forEach(mid=>{
    if(!adminMode && mid!==myMemberId) return; /* 본인 기록만 저장 (관리자는 전체) */
    const json = JSON.stringify(by[mid]||[]);
    if(json !== lastCk[mid]) updates[mid] = (by[mid] && by[mid].length) ? json : null;
  });
  if(!Object.keys(updates).length) return;
  Object.assign(lastCk, updates);
  try{ await gref('checkins').update(updates); }
  catch(e){ console.error(e); toast('저장 권한이 없어요. 다시 로그인해주세요'); }
}
/* 팀원 완전 삭제 (관리자): 팀원 정보 + 인증기록 + 인증사진 */
function addMonthsYMD(ds, n){ const d = parseDate(ds); return fmtDate(new Date(d.getFullYear(), d.getMonth()+n, d.getDate())); }
async function withdrawMember(mid){
  const m = members.find(x=>x.id===mid); if(!m) return;
  m.withdrawnAt = todayStr(); m.purgeAfter = addMonthsYMD(todayStr(), 6);
  await saveMembers();
  /* 진행 중·다가오는 회차 참가에서 빼기 */
  for(const r of Object.keys(participants||{})){ if(r >= currentRound() && participants[r] && participants[r][mid]) await setParticipant(mid, false, r); }
}
async function restoreWithdrawn(mid){
  const m = members.find(x=>x.id===mid); if(!m || !m.withdrawnAt) return false;
  delete m.withdrawnAt; delete m.purgeAfter;
  await saveMembers();
  return true;
}
async function purgeMember(mid){
  /* 완전 삭제: 쿠폰 삭제 + 결제내역은 금액만 남기고 개인정보 지우기 */
  if(fdb){
    try{
      const u = {};
      coupons.filter(c=>c.memberId===mid).forEach(c=>{ u['coupons/'+c.id] = null; });
      payments.filter(p=>p.memberId===mid).forEach(p=>{ u['payments/'+p.id+'/email'] = 'deleted'; u['payments/'+p.id+'/depositor'] = null; u['payments/'+p.id+'/memberName'] = '삭제된 회원'; });
      Object.keys(participants||{}).forEach(r=>{ if(participants[r] && participants[r][mid]) u['participants/'+r+'/'+mid] = null; });
      if(Object.keys(u).length) await gref().update(u);
    }catch(e){ console.error(e); }
  }
  const recs = checkins.filter(c=>c.memberId===mid);
  const keys = [];
  recs.forEach(r=>{ if(r.wakeupPhotoKey) keys.push(r.wakeupPhotoKey); if(r.activityPhotoKey) keys.push(r.activityPhotoKey); });
  for(const k of keys){ await deletePhoto(k); }
  checkins = checkins.filter(c=>c.memberId!==mid);
  members = members.filter(m=>m.id!==mid);
  if(selectedMemberId===mid){ selectedMemberId = null; heroVerified = false; }
  if(fdb){
    delete lastCk[mid];
    try{ await gref('checkins/'+mid).remove(); }catch(e){ console.error(e); } /* 인증기록 칸 자체를 삭제 */
  } else {
    await saveCheckins();
  }
  await saveMembers();
}
async function saveSettings(){
  if(!fdb){ memoryStore['gt:settings'] = JSON.stringify(settings); return; }
  if(!adminMode) return; /* 설정은 관리자만 저장할 수 있어요 */
  try{
    lastSettingsStr = JSON.stringify(settings);
    await gref('settings').set(lastSettingsStr);
    if(settings.periodStart) await gref('currentRound').set(settings.periodStart); /* 보안 규칙이 '이번 회차'를 알 수 있게 */
    syncAdminsNode();
  }catch(e){ console.error(e); toast('설정 저장 권한이 없어요'); }
}

/* ---- 인증 사진: gm/photos/<키> = {o: 주인 팀원id, d: 사진} ---- */
const PHOTO_RE = /^data:image\/(jpeg|jpg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/;
async function savePhoto(key, dataUrl, ownerId){
  try{
    if(!fdb){ memoryStore[key] = dataUrl; return true; }
    await gref('photos/'+safeKey(key)).set({ o: ownerId || myMemberId, d: dataUrl });
    return true;
  }catch(e){ console.error(e); toast('사진 저장에 실패했어요'); return false; }
}
async function loadPhoto(key){
  try{
    let d = null;
    if(!fdb) d = memoryStore[key] || null;
    else {
      const s = await gref('photos/'+safeKey(key)).get();
      if(s.exists()) d = (s.val()||{}).d || null;
      else { const old = await fdb.ref(keyToPath(key)).get(); d = old.exists() ? old.val() : null; } /* 보안 전환 전에 올린 사진 */
    }
    return (typeof d==='string' && PHOTO_RE.test(d)) ? d : null; /* 사진이 아닌 값은 절대 화면에 넣지 않음 */
  }catch(e){ return null; }
}
async function deletePhoto(key){
  if(!key) return;
  if(!fdb){ delete memoryStore[key]; return; }
  try{ await gref('photos/'+safeKey(key)).remove(); }catch(e){}
  if(adminMode){ try{ await fdb.ref(keyToPath(key)).remove(); }catch(e){} }
}

/* Resize + re-encode as JPEG so uploaded camera photos (often 3-8MB) shrink to a couple hundred KB. */
function compressImage(file, maxDim=1024, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('이미지를 읽을 수 없어요'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('파일을 읽을 수 없어요'));
    reader.readAsDataURL(file);
  });
}

/* ===================== Domain logic ===================== */
function timeToMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function isOnTime(member, actualTime){
  const target = timeToMinutes(member.targetTime), actual = timeToMinutes(actualTime);
  if(target==null||actual==null) return false;
  return actual <= target + (settings.graceMin);
}
function getCheckin(memberId, dateStr){ return checkins.find(c=>c.memberId===memberId && c.date===dateStr); }
function hasCheckin(memberId, dateStr){ const c=getCheckin(memberId,dateStr); return !!(c && c.wakeupTime && !c.held); }

function sundayNoonOf(weekStart){ const e=addDays(weekStart,6); return new Date(e.getFullYear(),e.getMonth(),e.getDate(),12,0,0); }
/* 한 주 안에서 '주말대체인증을 체크한' 평일 목록과 주말 인증 수를 구한다.
   체크하지 않고 놓친 날은 주말 만회 대상이 아니며 즉시 결석(-100)으로 확정된다. */
function weekMissedInfo(memberId, weekStart){
  const member = members.find(m=>m.id===memberId);
  const heldMissed=[], plainMissed=[]; let weekendChecked=0;
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i); const ds=fmtDate(d);
    if(member && isOutsideMission(member, ds)) continue; /* 미션 시작 전·등록 전·제외기간은 세지 않음 */
    if(isWeekend(d)){ if(hasCheckin(memberId,ds)) weekendChecked++; continue; }
    if(!hasCheckin(memberId,ds)){
      const c = getCheckin(memberId, ds);
      if(c && c.held) heldMissed.push(ds); /* 당일 체크한 날은 우선 만회 (-5) */
      else if(isPast(d)) plainMissed.push(ds); /* 체크 없이 놓친 과거 평일도 만회 가능 (-70, 남는 슬롯이 있을 때만) */
    }
  }
  const missed = heldMissed.concat(plainMissed);
  return {missed, weekendChecked, heldSet: new Set(heldMissed)};
}
/* 미션 범위 밖 날짜 판별: 관리자가 정한 시작일 이전·종료일 이후, (늦게 합류한 팀원의) 등록일 이전,
   인증제외기간은 성공도 실패도 아닌 '해당 없음'으로 취급해 캘린더·성공률 어디에도 나타나지 않아요 */
function isOutsideMission(member, dateStr){
  if(dateStr < settings.periodStart || dateStr > settings.periodEnd) return true;
  if(isBeforeRegistration(member, dateStr)) return true;
  if(isExemptDay(member, dateStr)) return true;
  return false;
}
/* 내부 점수(100 기준)를 화면 표시용 10점 만점 기준으로 변환 (예: -50 → -5, -5 → -0.5) */
function fmtScore10(s){
  const v = s / 10;
  const str = Number.isInteger(v) ? String(v) : v.toFixed(1);
  return v > 0 ? '+' + str : str;
}
function dayStatus(member, dateStr){
  if(isOutsideMission(member, dateStr)) return {code:'none', label:'', score:0, leaf:''};
  const c = getCheckin(member.id, dateStr);
  const d0 = parseDate(dateStr);
  if(c && c.held && !isPast(d0)) return {code:'pending', label:'⏸️ 주말대체 보류', score:0, leaf:'⏸️'};
  if(!c || !c.wakeupTime || c.held || c.wakeupTime==='보충'){
    const d = d0;
    /* ⭐ 수정된 부분: 주말(토·일)이고 그날 인증이 없으면
       결석(🔥)이 아니라 '해당없음'으로 처리해서 결석 이모지가 뜨지 않게 함 */
    if(isWeekend(d)) return {code:'none', label:'', score:0, leaf:''};
    const ws = startOfWeek(d);
    const info = weekMissedInfo(member.id, ws);
    const idx = info.missed.indexOf(dateStr);
    const wasHeld = info.heldSet.has(dateStr);
    /* ⭐ 대체인증(주말에 채운 평일)은 점수는 예전 그대로 두고, 표시는 '그로우모닝 성공(😆)'으로 보여줘요 */
    if(idx >= 2) return {code:'absent', label:'❌ 그로우모닝 실패', score:-100, leaf:'❌'};
    if(idx >= 0 && info.weekendChecked > idx){
      if(wasHeld) return {code:'madeup', label:'✅ 주말대체 완료 (미리 체크함)', score:-70, leaf:'✅'};
      return {code:'madeup-late', label:'✅ 주말대체 완료 (뒤늦게 채움)', score:-70, leaf:'✅'};
    }
    if(idx >= 0 && new Date() < sundayNoonOf(ws)){
      if(wasHeld) return {code:'pending', label:'⏸️ 주말대체 보류', score:0, leaf:'⏸️'};
      return {code:'absent', label:'❌ 그로우모닝 실패(주말 만회 가능)', score:-100, leaf:'❌'};
    }
    return {code:'absent', label:'❌ 그로우모닝 실패', score:-100, leaf:'❌'};
  }
  const onTime = isOnTime(member, c.wakeupTime);
  const hasAct = !!c.activityTime; /* 루틴 1개 이상을 시간 내에 체크했으면 그걸로 루틴은 성공 */
  if(!hasAct && dateStr === todayStr()){
    const win = routineWindow(c.wakeupTime, member.targetTime);
    if(win!=null && minutesNow_() <= win.max){
      return {code:'pending', label:'⏳ 모닝루틴 인증 대기 (기상 후 30~60분에 체크)', score:0, leaf:'⏳'};
    }
  }
  const weekendDay = isWeekend(d0); /* ⭐ 주말에 직접 체크한 날은 성공이어도 평일 성공(😆)과 다른 이모지(🌟)로 구분 */
  if(onTime && hasAct) return {code:'perfect', label:'😆 그로우모닝성공', score:0, leaf: weekendDay?'🌟':'😆'};
  /* 늦은기상이라도 목표시간에서 1시간 이내에 일어났고 루틴까지 완료했다면, '기상만 실패'로 점수를 지켜줘요.
     그 외(1시간 넘게 늦었거나, 루틴을 하나도 체크 못했거나)는 전부 결석과 같은 완전 실패로 처리해요. */
  const tMin = timeToMinutes(member.targetTime), wMin = timeToMinutes(c.wakeupTime);
  const within60 = (tMin!=null && wMin!=null) && (wMin - tMin) <= 60;
  if(!onTime && hasAct && within60) return {code:'late', label:'😴 늦은 기상 (1시간 이내 + 루틴체크)', score:-40, leaf:'😴'};
  return {code:'latewake', label:'❌ 그로우모닝 실패', score:-100, leaf:'❌'};
}

function getWeeksOfMonth(year, monthIdx){
  const first=new Date(year,monthIdx,1), last=new Date(year,monthIdx+1,0);
  const weeks=[]; let cur=startOfWeek(first);
  while(cur<=last){ weeks.push({start:new Date(cur), end:addDays(cur,6)}); cur=addDays(cur,7); }
  return weeks;
}
function periodStartDate(){ return parseDate(settings.periodStart); }
function periodEndDate(){ return parseDate(settings.periodEnd); }
function periodWeeks(){
  const start = periodStartDate(), end = periodEndDate();
  const weeks=[]; let cur=startOfWeek(start);
  const lastWeekStart = startOfWeek(end);
  while(cur<=lastWeekStart){ weeks.push({start:new Date(cur), end:addDays(cur,6)}); cur=addDays(cur,7); }
  return weeks;
}
function isWeekend(d){ const dow=d.getDay(); return dow===0 || dow===6; }
function weekDaysChecked(memberId, week){
  let weekdayCount=0, weekendCount=0;
  for(let i=0;i<7;i++){
    const d=addDays(week.start,i);
    if(isFuture(d)) continue;
    const checked = hasCheckin(memberId, fmtDate(d));
    if(!checked) continue;
    if(isWeekend(d)) weekendCount++; else weekdayCount++;
  }
  const deficit = Math.max(0, 5-weekdayCount);     // 평일 중 못 채운 날 수
  const makeupUsed = Math.min(weekendCount, deficit, 2); // 주말 인증으로 메꾼 날 수 (최대 2일)
  return weekdayCount + makeupUsed; // 0~5
}
function weekPendingCount(memberId, week){
  // 주말 보충으로도 아직 못 채운, 평일 중 인증 못한 날 수 (보류 중)
  let weekdayCount=0, weekendCount=0, weekdayMissedPast=0;
  for(let i=0;i<7;i++){
    const d=addDays(week.start,i);
    if(isFuture(d)) continue;
    const checked = hasCheckin(memberId, fmtDate(d));
    if(isWeekend(d)){ if(checked) weekendCount++; }
    else { if(checked) weekdayCount++; else weekdayMissedPast++; }
  }
  const deficit = Math.max(0, 5-weekdayCount);
  const makeupUsed = Math.min(weekendCount, deficit, 2);
  return Math.max(0, weekdayMissedPast - makeupUsed);
}
function weekRate(memberId, week){ return Math.min(weekDaysChecked(memberId,week),5)/5*100; }
function teamWeekRate(week){
  const members = teamMembers();
  if(members.length===0) return 0;
  return Math.round(members.reduce((s,m)=>s+weekRate(m.id,week),0)/members.length);
}
/* 확정된 결석 일수: 3일째 이상 결석(즉시 확정) + 일요일 정오까지 보충 못한 보류 */
function memberDefiniteAbsences(memberId){
  const now = new Date(); let total = 0;
  periodWeeks().forEach(w=>{
    if(w.start > todayDate) return;
    const info = weekMissedInfo(memberId, w.start);
    info.missed.forEach((ds, idx)=>{
      if(idx >= 2){ total++; return; }          // 주중 3일째부터는 즉시 결석 확정
      if(info.weekendChecked > idx) return;      // 주말 보충으로 채워짐
      if(now >= sundayNoonOf(w.start)) total++;  // 마감 지나면 결석 확정
    });
  });
  return total;
}
/* 인증제외기간(휴가·병가 등) 판별: 이 기간의 날짜는 누적성공률 계산에서 완전히 빠져요 */
function isExemptDay(member, dateStr){
  if(!member.exemptStart || !member.exemptEnd) return false;
  return dateStr >= member.exemptStart && dateStr <= member.exemptEnd;
}
/* 팀원등록일 이전 날짜 판별: 나중에 합류한 팀원은 등록일 이전 날짜가 누적성공률 계산에서 빠져요
   (등록일 정보가 없는 예전 팀원은 기존과 동일하게 미션 시작일부터 전부 반영) */
function isBeforeRegistration(member, dateStr){
  return !!member.registeredAt && dateStr < member.registeredAt;
}
/* 누적성공률 = 100%에서 시작, 미션기간(또는 팀원등록일~목표종료일) 전체 평일 수를 기준으로 인증 결과만큼만 차감
   (그로우모닝성공 0, 부분인증(늦은기상+루틴) -20, 부분인증(늦은기상만/루틴미인증) -50,
    미리 체크한 대체인증 -10, 뒤늦게 채운 대체인증(주말) -70, 다시도전(결석) -100)
   → 100% 기준 = 월~금 기상+루틴 인증을 목표기간 내내 완료
   → 120% 기준 = 100% 기준 + 주말도 전부 인증 (평일:주말 = 5:2 비율이므로 주말 인증 1건당 50점을 더해야
      전체 주말을 다 채웠을 때 정확히 +20%p가 되어 120%에 닿는다)
   인증제외기간 및 등록일 이전 날짜는 분모(필수일수)·분자(차감) 모두에서 빠져요 */
const WEEKEND_BONUS = 50;
/* 그 주 5일(월~금)이 전부 완전 성공(0점)인지 확인 — 자진신청 만회(-5점)는 감점이 있으므로 보너스 대상에서 제외됨.
   아직 결과가 안 정해진(pending) 날이 있으면 판단 보류(null) */
function weekWeekdayAllZero(memberId, weekStart){
  const member = members.find(m=>m.id===memberId);
  for(let i=0;i<5;i++){
    const d = addDays(weekStart, i);
    if(isFuture(d) || d > todayDate) continue;
    const ds = fmtDate(d);
    if(member && isOutsideMission(member, ds)) continue;
    if(sameDate(d, todayDate) && !getCheckin(memberId, ds)) continue;
    const st = dayStatus(member, ds);
    if(st.code==='pending') return false;
    if(st.score !== 0) return false;
  }
  return true;
}
function memberCumulativeRate(memberId){
  const member = members.find(m=>m.id===memberId);
  if(!member) return 100;
  let totalRequired = 0;
  periodWeeks().forEach(w=>{
    for(let i=0;i<5;i++){
      const d = addDays(w.start, i);
      const ds1 = fmtDate(d);
      if(!isOutsideMission(member, ds1)) totalRequired++;
    }
  });
  if(totalRequired === 0) return 100;
  let totalDeduction = 0;
  periodWeeks().forEach(w=>{
    if(w.start > todayDate) return;
    for(let i=0;i<5;i++){  // 월~금만
      const d = addDays(w.start, i);
      if(isFuture(d) || d > todayDate) continue;
      const ds2 = fmtDate(d);
      if(isOutsideMission(member, ds2)) continue; // 시작일 이전·등록일 이전·제외기간은 건너뜀
      /* 당일 반영: 오늘 아직 인증(또는 주말대체인증 체크)이 없으면 즉시 결석으로 계산되고,
         인증하거나 체크하는 순간 바로 회복돼요 */
      const st = dayStatus(member, ds2);
      if(st.code==='pending') continue; // 아직 결과가 정해지지 않은 보류일은 계산에서 제외
      totalDeduction += st.score;
    }
    /* 그 주 금요일까지 지났고, 평일 5일이 전부 완전 성공(0점)이라면 주말 추가 인증에 보너스 (자진신청 만회는 -5점이라 보너스 대상 아님) */
    const friday = addDays(w.start,4);
    if(friday <= todayDate){
      if(weekWeekdayAllZero(memberId, w.start)){
        for(let i=5;i<7;i++){
          const d = addDays(w.start,i);
          if(d > todayDate) continue;
          if(hasCheckin(memberId, fmtDate(d))) totalDeduction += WEEKEND_BONUS;
        }
      }
    }
  });
  return Math.max(0, Math.min(120, Math.round(100 + totalDeduction / totalRequired)));
}
/* 그날 적어둔 모닝루틴 목표(최대 3개) 중 몇 개를, 정해진 체크 유효시간(기상 후 30~60분) 안에
   체크했는지 계산 → {done, total, rate}. 목표를 안 적어뒀거나 사진으로만 인증한 옛날 기록은 만점 처리 */
function goalProgress(member, ds, wakeTime){
  const rec = getCheckin(member.id, ds);
  const goals = memberGoals(member).map((g,i)=>({g,i})).filter(x=>x.g && x.g.trim());
  const total = goals.length;
  if(total===0) return {done:1, total:1, rate:1, measured:false};
  const checks = (rec && rec.routineChecks) || [];
  const anyCheck = Array.isArray(checks) && checks.some(x=>x && x.done);
  if(!anyCheck){
    if(rec && rec.activityTime) return {done:total, total, rate:1, measured:false};
    return {done:0, total, rate:0, measured:true};
  }
  const win = routineWindow(wakeTime, member.targetTime);
  let done = 0;
  if(win){
    goals.forEach(x=>{
      const ck = checks[x.i];
      if(!ck || !ck.done) return;
      const t = timeToMinutes(ck.time);
      if(t!=null && t >= win.min && t <= win.max) done++;
    });
  }
  return {done, total, rate: done/total, measured:true};
}
/* 목표성공률 = 미션기간 중 지나간 평일들의 '목표 달성률' 평균 (%)
   주말대체인증으로 채운 날은 목표를 따로 판단할 수 없어 분모에서 제외해요 */
function memberGoalRate(memberId){
  const member = members.find(m=>m.id===memberId);
  if(!member) return 100;
  let n=0, sum=0;
  periodWeeks().forEach(w=>{
    if(w.start > todayDate) return;
    for(let i=0;i<5;i++){
      const d = addDays(w.start, i);
      if(isFuture(d) || d > todayDate) continue;
      const ds2 = fmtDate(d);
      if(isOutsideMission(member, ds2)) continue;
      const st = dayStatus(member, ds2);
      if(st.code==='pending' || st.code==='none') continue;
      if(st.code==='madeup' || st.code==='madeup-late') continue;
      n++;
      const c = getCheckin(member.id, ds2);
      if(!c || !c.wakeupTime || c.held || c.wakeupTime==='보충') continue;
      sum += goalProgress(member, ds2, c.wakeupTime).rate;
    }
  });
  return n ? Math.round(sum / n * 100) : 100;
}
function monthWeeksFor(year,monthIdx){ return getWeeksOfMonth(year,monthIdx); }
function currentWeekIndex(){
  const weeks = periodWeeks();
  if(weeks.length===0) return 0;
  /* 시:분:초를 빼고 '날짜'만으로 비교해야 해요. 그렇지 않으면 각 주의 마지막 날(일요일)
     자정(00:00)이 지난 시각에는 어느 주에도 안 걸쳐서 엉뚱하게 마지막 주로 튕기는 버그가 생겨요. */
  const today0 = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
  for(let i=0;i<weeks.length;i++){ if(today0>=weeks[i].start && today0<=weeks[i].end) return i; }
  if(today0 < weeks[0].start) return 0;
  return weeks.length-1;
}
function elapsedDaysOfPeriod(){
  const start = periodStartDate(), end = periodEndDate();
  const endClamped = todayDate<end? todayDate : end;
  if(endClamped<start) return [];
  const arr=[]; let d=new Date(start);
  while(d<=endClamped){ arr.push(fmtDate(d)); d=addDays(d,1); }
  return arr;
}
function memberPointAvg(memberId){
  const days = elapsedDaysOfPeriod();
  if(days.length===0) return 0;
  const member = members.find(m=>m.id===memberId);
  const total = days.reduce((s,d)=>s+dayStatus(member,d).score,0);
  return Math.round(total/days.length);
}
/* 오늘 현황 집계 (dayStatus와 같은 기준: 기상 정시여부 + 목표달성률 100% 여부)
   세 항목은 서로 겹치지 않아요 (한 사람은 셋 중 한 곳에만 들어갑니다)
   - grow        : 😆 그로우모닝성공 = 기상성공 + 모닝루틴을 둘 다 해낸 사람
   - wakeSuccess : ⏰ 기상성공만 = 기상은 성공했지만 루틴은 다 못 채운 사람
   - goalCert    : 🎯 루틴인증만 = 루틴은 전부 달성했지만 기상은 늦은 사람
   - held        : ⏳ 오늘을 주말대체인증으로 체크해 둔 사람 수 */
/* 오늘 현황: 그로우모닝성공(기상+루틴 둘 다) / 주말대체인증, 딱 2가지로 단순화 */
function todayStats(){
  const members = teamMembers();
  const ds = todayStr(); let grow=0;
  if(ds < settings.periodStart || ds > settings.periodEnd){
    return {grow, notDone:0, total:0};
  }
  let total = 0;
  members.forEach(m=>{
    if(isOutsideMission(m, ds)) return;
    total++;
    const st = dayStatus(m, ds);
    if(st.code==='perfect') grow++;
  });
  return {grow, notDone: total-grow, total};
}

      mk = st0 ? (st0.leaf || '😊') : '😊';
    }
    /* 지난 날짜는 눌러서 그날 기록(사진 포함)을 캘린더 상세보기에서 바로 볼 수 있게 함 */
    const clickable = (!isFuture(d) && !sameDate(d,todayDate));
    if(clickable) cls += ' pill-clickable';
    pills += `<div class="wd-pill ${cls}" ${clickable?`data-pastdate="${ds}"`:''}><span class="wd-lbl">${lbls[i]}${weekend?' 대체':''}</span><span class="wd-mk">${mk}</span></div>`;
  }
  const rangeLbl = `${pad(week.start.getMonth()+1)}.${pad(week.start.getDate())}–${pad(week.end.getMonth()+1)}.${pad(week.end.getDate())}`;
  const dotsHtml = weeks.map((w,idx)=>`<span class="week-dot ${idx===wkIdx?'active':''}" data-widx="${idx}"></span>`).join('');

  document.getElementById('hero-card').innerHTML = `
    <div class="hero-top">
      <div>
        <div class="hero-day-label" id="hero-month-link" role="button">${ps.getMonth()+1}월 · ${isCurrentWeek?'This Week':rangeLbl} ›</div>
        <div class="hero-day">${wkIdx+1}<span>주차</span></div>
      </div>
      <div class="hero-period">
        ${pad(ps.getMonth()+1)}.${pad(ps.getDate())} — ${pad(pe.getMonth()+1)}.${pad(pe.getDate())}<br/>
        <span class="hero-goal-pill">🎯 평일 5일 필수</span>
        <span class="hero-goal-pill cumulative">📈 누적 ${cumRate}%</span>
      </div>
    </div>
    <div class="stem-wrap" id="hero-swipe-zone">
      <div class="stem-labels"><span>${heroMember? `<b class="hero-member-name">${heroMember.name}</b>님 `:''}이번 주 <b>${memberDays}</b>/5일 달성</span></div>
      <div class="week-bar-track"><div class="week-bar-fill" style="width:${Math.min(memberDays,5)/5*100}%"></div></div>
      <div class="week-days-row">${pills}</div>
      <div class="week-dots">${dotsHtml}</div>
      <div class="week-hint">👆 좌우로 스와이프하면 다른 주차를 볼 수 있어요<br/>월~금은 <b>필수 인증</b>, 놓친 날은 <b>주말대체인증</b>으로 채울 수 있어요<br/>(당일 주말대체인증체크시 감점 최소)</div>
    </div>`;
  document.getElementById('hero-month-link').addEventListener('click', ()=> switchTab('calendar'));
  document.querySelectorAll('.week-dot').forEach(dot=>{
    dot.addEventListener('click', ()=>{ heroWeekIdx = Number(dot.dataset.widx); renderHero(); });
  });
  document.querySelectorAll('[data-pastdate]').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      calFilterId = '';
      calDetailDate = pill.dataset.pastdate;
      calViewDate = new Date(parseDate(calDetailDate).getFullYear(), parseDate(calDetailDate).getMonth(), 1);
      switchTab('calendar');
      renderCalendar();
    });
  });
  const swipeZone = document.getElementById('hero-swipe-zone');
  let heroTouchX=null, heroTouchY=null;
  swipeZone.addEventListener('touchstart', e=>{
    heroTouchX = e.touches[0].clientX; heroTouchY = e.touches[0].clientY;
  }, {passive:true});
  swipeZone.addEventListener('touchend', e=>{
    if(heroTouchX===null) return;
    const dx = e.changedTouches[0].clientX - heroTouchX;
    const dy = e.changedTouches[0].clientY - heroTouchY;
    heroTouchX = null; heroTouchY = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) changeHeroWeek(1); else changeHeroWeek(-1);
    }
  }, {passive:true});
}

  el.innerHTML = `

      <div class="stat-card"><div class="ic">⏳</div><div class="lbl">주말대체인증</div><div class="val">${ts.notDone}<small>명</small></div></div>

      <div class="legend-row"><div class="legend-dot" style="background:#B5793D"></div><div><b>😴 늦은 기상</b><span class="legend-desc">목표시간 1시간 이내 지각 + 루틴 체크</span></div><span class="pt">-4</span></div>

/* ===================== Render: Checkin ===================== */
function renderCheckin(){
  const el = document.getElementById('sec-checkin');
  if(members.length===0){
    el.innerHTML = `<div class="empty-state" style="margin-top:6px;"><span class="ic">🙍</span>팀원을 먼저 등록해주세요 (팀원 탭)</div>`;
    return;
  }
  if(!selectedMemberId) selectedMemberId = members[0].id;
  if(checkinStage==='form'){
    renderCheckinForm(el);
  } else if(checkinStage==='view'){
    renderCheckinView(el);
  } else {
    renderCheckinGrid(el);
  }
}

/* 본인확인: 구글 로그인 이메일이 이 팀원의 googleEmail과 일치해야 인증 폼이 열린다.
   (이름은 openPinModal 이라는 함수명을 그대로 쓰지만, 내부 동작은 PIN 대신 구글 로그인이다) */
async function openPinModal(memberId, scrollTarget){
  const member = members.find(m=>m.id===memberId);
  if(!member) return;
  pinModalScrollTarget = scrollTarget || null;
  const already = myGoogleMatchedMember();
  if(already && already.id === memberId){
    confirmMemberSelection(memberId);
    return;
  }
  if(already && already.id !== memberId){
    toast(already.name + '님 계정으로 로그인되어 있어요. ' + member.name + '님으로 인증하려면 로그아웃 후 다시 로그인해주세요');
    return;
  }
  const matched = await signInWithMemberGoogle();
  if(matched && matched.id === memberId){
    confirmMemberSelection(memberId);
  } else if(matched && matched.id !== memberId){
    toast(matched.name + '님 계정으로 로그인되어 있어요. ' + member.name + '님 화면은 볼 수 없어요');
  }
}
function closePinModal(){
  pinModalMemberId = null;
  pinModalScrollTarget = null;
  renderCheckin();
}
function confirmMemberSelection(memberId){
  selectedMemberId = memberId;
  heroVerified = true;
  wakeupPhotoData = null; activityPhotoData = null;
  try{ localStorage.setItem(LAST_MEMBER_KEY, memberId); }catch(e){}
  savePinSession(memberId); /* 3시간 동안은 다른 앱 다녀와도 PIN 다시 안 물어봄 */
  const scrollTarget = pinModalScrollTarget;
  pinModalMemberId = null; pinModalScrollTarget = null;
  checkinStage = 'form';
  renderCheckin(); renderHero();
  if(scrollTarget){
    setTimeout(()=>{ document.getElementById(scrollTarget)?.scrollIntoView({behavior:'smooth', block:'start'}); }, 200);
  }
}

/* ===================== 오늘인증: 1단계(이름 그리드 + PIN 팝업) ===================== */
function renderCheckinGrid(el){
  const members = teamMembers();
  /* ㄱㄴㄷ순 이름 토글 (그리드는 등록순 그대로 유지, 이 화면에서만 보여요) */
  const byName = [...members].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const nameOptions = byName.map(m=>`<option value="${m.id}" ${viewingMemberId===m.id?'selected':''}>${m.name}</option>`).join('');
  const cards = members.map(m=>`
    <div class="member-grid-card" data-id="${m.id}">
      <div class="avatar av-sm" style="background:${m.color}">${m.name[0]}</div>
      <div class="nm">${m.name}</div>
    </div>`).join('');
  const pinMember = pinModalMemberId ? members.find(m=>m.id===pinModalMemberId) : null;

  el.innerHTML = `
    ${isCertBlockedNow() ? `<div class="admin-banner"><span class="ic">🌙</span><strong>새벽 12시~4시는 인증 시간이 아니에요</strong><p style="margin-top:4px;">사진 업로드·모닝루틴 체크·저장이 잠시 제한돼요. 4시 이후 다시 시도해주세요.</p></div>` : ''}
    <div class="section-title" style="margin-top:6px;">오늘의 그로우모닝
      <select id="checkin-name-toggle" class="name-toggle" aria-label="이름으로 바로가기">
        <option value="">이름 선택 ▾</option>
        ${nameOptions}
      </select>
    </div>
    <div class="member-grid" id="checkin-member-grid">${cards}</div>
    ${pinMember ? `
    <div class="pin-modal-backdrop" id="pin-modal-backdrop">
      <div class="pin-modal">
        <div class="cert-head"><span class="step-badge" style="background:var(--ink)">🔒</span><h4>${pinMember.name}님 본인 확인</h4></div>
        <p class="pin-modal-desc">PIN 넘버는 핸드폰 끝 4자리 입니다.<br/>인증 사진 업로드시 자동 저장 됩니다.</p>
        <div class="pin-row" style="justify-content:center;">
          <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pin-input" placeholder="••••" style="flex:0 0 auto; width:160px;"/>
        </div>
        <p class="pin-error" id="pin-error">PIN이 올바르지 않습니다</p>
        <div class="pin-modal-actions">
          <button type="button" class="btn btn-mini ghost" id="pin-modal-cancel" style="flex:1">취소</button>
          <button type="button" class="btn btn-mini" id="pin-modal-confirm" style="flex:1">확인</button>
        </div>
      </div>
    </div>` : ''}
  `;

  const nameToggle = document.getElementById('checkin-name-toggle');
  if(nameToggle){
    nameToggle.addEventListener('change', ()=>{
      const id = nameToggle.value;
      if(!id) return;
      const mine = myGoogleMatchedMember();
      if(mine && mine.id === id){
        openPinModal(id);
      } else {
        viewingMemberId = id;
        checkinStage = 'view';
        renderCheckin();
      }
    });
  }

  document.querySelectorAll('#checkin-member-grid .member-grid-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      const clickedId = c.dataset.id;
      const mine = myGoogleMatchedMember(); /* 지금 구글로그인 된 계정이 이 팀원 본인인지 확인 */
      if(mine && mine.id === clickedId){
        openPinModal(clickedId); /* 본인이면 바로 사진 업로드하는 인증 화면으로 이동 */
      } else {
        viewingMemberId = clickedId;
        checkinStage = 'view'; /* 본인이 아니면 예전처럼 보기 전용 화면 */
        renderCheckin();
      }
    });
  });

  if(pinMember){
    const pinInput = document.getElementById('pin-input');
    pinInput.focus();
    document.getElementById('pin-modal-cancel').addEventListener('click', closePinModal);
    document.getElementById('pin-modal-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='pin-modal-backdrop') closePinModal(); });
    const tryConfirm = ()=>{
      const v = pinInput.value;
      if(v.length!==4 || v!==pinMember.pin){
        document.getElementById('pin-error').style.display='block';
        pinInput.focus();
        return;
      }
      confirmMemberSelection(pinMember.id);
    };
    document.getElementById('pin-modal-confirm').addEventListener('click', tryConfirm);
    pinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryConfirm(); });
  }
}

/* ===================== 오늘인증: 타인 기록 "보기 전용" 화면 (PIN 불필요) ===================== */
function renderCheckinView(el){
  const member = members.find(m=>m.id===viewingMemberId) || members[0];
  const ds = todayStr();
  const c = getCheckin(member.id, ds) || {};
  const st = dayStatus(member, ds);
  const goals = memberGoals(member).filter(g=>g);
  const checks = (c.routineChecks) || [null,null,null];

  const photoBox = (id, key)=> key
    ? `<div class="view-photo-box" id="${id}"><span class="view-photo-loading">사진 불러오는 중...</span></div>`
    : `<div class="view-photo-empty">아직 올린 사진이 없어요</div>`;

  const routineRows = goals.length ? goals.map((g,i)=>{
    const ck = checks[i];
    return `<div class="view-routine-row ${ck&&ck.done?'done':''}">
      <span class="view-routine-check">${ck&&ck.done ? '✅' : '⬜'}</span>
      <span class="view-routine-goal">${g}</span>
      ${ck&&ck.done&&ck.time? `<span class="routine-time">✓ ${ck.time}</span>` : ''}
    </div>`;
  }).join('') : `<p class="cert-desc">등록된 모닝루틴이 없어요</p>`;

  el.innerHTML = `
    <div class="checkin-form-header">
      <button type="button" class="checkin-back-btn" id="btn-view-back" aria-label="뒤로가기">← 뒤로가기</button>
    </div>
    <div class="section-title" style="margin-top:6px;">${member.name}님의 오늘 기록</div>

    ${(c.wakeupTime || c.held) ? `<div class="status-pill ${st.code}" style="margin-top:12px;">${st.label}${(st.code==='pending' || st.score===0) ? '' : ` · ${fmtScore10(st.score)}점`}</div>` : ''}

    <div id="view-cert-content">
    ${c.held ? `<div class="cert-card hold-card" style="margin-top:12px;"><span><b>⏳ 오늘은 주말대체인증</b>으로 표시돼 있어요</span></div>` : `
    <div class="cert-card" style="margin-top:16px;">
      <div class="cert-head"><span class="step-badge">STEP 1</span><h4>기상 인증</h4></div>
      <p class="cert-desc">${c.wakeupTime ? `기상시간 <b>${c.wakeupTime}</b>` : '아직 기록이 없어요'}</p>
      ${photoBox('view-wakeup-photo-box', c.wakeupPhotoKey)}
    </div>

    <div class="cert-card">
      <div class="cert-head"><span class="step-badge" style="background:var(--green)">STEP 2</span><h4>모닝루틴</h4></div>
      <div class="view-routine-list">${routineRows}</div>
      ${c.activityPhotoKey ? photoBox('view-activity-photo-box', c.activityPhotoKey) : ''}
    </div>`}
    </div>
  `;

  document.getElementById('btn-view-back').addEventListener('click', ()=>{
    checkinStage = 'grid';
    viewingMemberId = null;
    renderCheckin();
  });

  /* 이름을 누르면 그 사람의 인증 내용(기상인증/모닝루틴)이 바로 눈에 보이도록,
     화면을 자동으로 살짝 내려서 인증 카드가 보이는 위치까지 스크롤해준다 */
  setTimeout(()=>{
    document.getElementById('view-cert-content')?.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);

  /* 사진은 '탭해야 보이는 안내칸'이 아니라, 압축된 미리보기 이미지를 바로 불러와 보여준다.
     (미리보기를 한 번 더 탭하면 원본 크기로 크게 볼 수 있음) */
  const loadIntoBox = (boxId, key)=>{
    if(!key) return;
    loadPhoto(key).then(dataUrl=>{
      const box = document.getElementById(boxId);
      if(!box) return;
      if(!dataUrl){ box.outerHTML = '<div class="view-photo-empty">사진을 불러올 수 없어요</div>'; return; }
      box.innerHTML = `<img src="${dataUrl}" alt="인증 사진 미리보기"/>`;
      box.addEventListener('click', ()=> openPhotoOverlay(dataUrl));
    });
  };
  loadIntoBox('view-wakeup-photo-box', c.wakeupPhotoKey);
  loadIntoBox('view-activity-photo-box', c.activityPhotoKey);
}

/* 카메라로 찍은 사진을 줄이면서 아래쪽에 '시간 · 날짜 · 그로우모닝' 글씨를 새긴다 */
function stampImage(file, when, maxDim=1024, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const days = ['일','월','화','수','목','금','토'];
        const timeTxt = pad(when.getHours())+':'+pad(when.getMinutes());
        const dateTxt = when.getFullYear()+'.'+pad(when.getMonth()+1)+'.'+pad(when.getDate())+' ('+days[when.getDay()]+')';
        const u = Math.max(w,h)/1024, band = Math.round(118*u);
        const g = ctx.createLinearGradient(0, h-band*1.5, 0, h);
        g.addColorStop(0,'rgba(20,35,38,0)'); g.addColorStop(1,'rgba(20,35,38,.78)');
        ctx.fillStyle = g; ctx.fillRect(0, h-band*1.5, w, band*1.5);
        const x = Math.round(28*u), base = h - Math.round(30*u);
        ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6*u;
        ctx.font = `800 ${Math.round(66*u)}px 'Pretendard Variable', Pretendard, sans-serif`;
        ctx.fillText(timeTxt, x, base);
        const tW = ctx.measureText(timeTxt).width;
        ctx.font = `600 ${Math.round(24*u)}px 'Pretendard Variable', Pretendard, sans-serif`;
        ctx.fillText(dateTxt, x + tW + 16*u, base - Math.round(32*u));
        ctx.fillStyle = '#F2C9B5';
        ctx.fillText('🌱 그로우모닝 기상인증', x + tW + 16*u, base);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('이미지를 읽을 수 없어요'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('파일을 읽을 수 없어요'));
    reader.readAsDataURL(file);
  });
}
/* 내 갤러리에 저장: 폰 공유창(갤러리/이미지 저장) → 안 되면 다운로드 폴더로 */
async function savePhotoToGallery(dataUrl){
  const n = new Date();
  const name = 'growmorning_'+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate())+'_'+pad(n.getHours())+pad(n.getMinutes())+'.jpg';
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const f = new File([blob], name, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; }
  }catch(err){ if(err && err.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = dataUrl; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('다운로드 폴더에 저장했어요 (갤러리 → Download 앨범)');
}

  if(!pill){

    const note = area.querySelector('.photo-note');

  }
  pill.className = 'status-pill ' + st2.code;
  pill.innerHTML = html;
}

function setupPhotoUpload(prefix, timeFieldId, savedKey, member, ds){
  const box = document.getElementById(prefix+'-photo-box');
  const input = document.getElementById(prefix+'-photo-input');
  const label = prefix==='wakeup' ? '기상 인증 사진 업로드' : '모닝루틴 사진 업로드';

    box.querySelector('#wakeup-btn-cam')?.addEventListener('click', ()=>{ fromCam = true; camInput?.click(); });
  };

  /* 사진 프리뷰 공통 바인딩: 탭하면 크게보기, ✕ 누르면 '그 사진에 해당하는 기록만' 삭제
     (예전엔 모닝루틴 사진을 지워도 기상 기록까지 통째로 사라지는 버그가 있었음) */
  const bindSaved = (dataUrl)=>{
    box.querySelector('.photo-preview img')?.addEventListener('click', ()=> openPhotoOverlay(dataUrl));
    box.querySelector('.photo-remove')?.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const isWake = prefix==='wakeup';

        /* A안: 기상시간을 지우면 그날 전체가 미인증 처리된다는 걸 정확히 경고.
           실수로 지우는 걸 막기 위해 같은 경고를 두 번 확인받는다 */
        const warnMsg = '⚠️ 기상 시간을 지우면 오늘 전체가 미인증(다시도전) 처리돼요.\n모닝루틴을 이미 체크했어도, 오늘 하루는 인증 실패로 바뀌어요.\n정말 삭제할까요?';
        ok = confirm(warnMsg) && confirm(warnMsg);
      } else {
        ok = confirm('모닝루틴 인증 사진을 삭제할까요? (기상 인증과 해빗트래커 체크는 유지)');
      }
      if(!ok) return;
      const rec = getCheckin(member.id, ds);
      if(rec){
        try{
          if(isWake && rec.wakeupPhotoKey) await deletePhoto(rec.wakeupPhotoKey);
          if(!isWake && rec.activityPhotoKey) await deletePhoto(rec.activityPhotoKey);
        }catch(e){}
        if(isWake){
          rec.wakeupPhoto = false; rec.wakeupPhotoKey = null; rec.wakeupTime = null;
        } else {
          rec.activityPhoto = false; rec.activityPhotoKey = null;
          /* 사진을 지워도 해빗트래커 체크로 인증된 시각이 있으면 그건 유지 */
          rec.activityTime = routineCertifiedTime(member, ds, rec.wakeupTime || '') || null;
        }
        /* 기상·루틴 모두 비었고 다른 기록도 없으면 그때만 레코드 자체를 정리 */
        const empty = !rec.wakeupPhoto && !rec.activityPhoto && !rec.wakeupTime && !rec.activityTime
                      && !rec.held && !(rec.routineChecks||[]).some(x=>x&&x.done);
        if(empty){ const idx = checkins.findIndex(x=>x.id===rec.id); if(idx>=0) checkins.splice(idx,1); }
        await saveCheckins();
      }
      if(isWake) wakeupPhotoData=null; else activityPhotoData=null;
      input.value='';
      toast(isWake ? '기상 인증 사진을 삭제했어요' : '모닝루틴 사진을 삭제했어요');
      renderAll();
    });
  };
  bindPlaceholder();
  if(prefix==='wakeup' && wakeupPhotoData) bindSaved(wakeupPhotoData);
  /* 저장된 사진이 있으면 자동으로 불러와 화면에 바로 보여준다 */
  const hasNew = prefix==='wakeup' ? !!wakeupPhotoData : !!activityPhotoData;
  if(savedKey && !hasNew){
    loadPhoto(savedKey).then(dataUrl=>{
      if(!dataUrl){ showPlaceholder(); return; }
      const stillNoNew = prefix==='wakeup' ? !wakeupPhotoData : !activityPhotoData;
      if(!stillNoNew) return; // 그 사이 새 사진을 첨부했다면 덮어쓰지 않음
      box.innerHTML = savedPhotoHtml(dataUrl);
      bindSaved(dataUrl);
    });
  }
  const onPick = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const isCam = (e.target === camInput); fromCam = false;
    const shotAt = new Date(); /* 카메라로 찍은 순간 = 지금 */
    if(isCertBlockedNow()){ certBlockedToast(); e.target.value=''; return; }
    if(prefix==='activity' && !adminMode){
      const wrec = getCheckin(member.id, ds);
      const wakeupDone = !!(wrec && wrec.wakeupTime && wrec.wakeupTime!=='보충' && !wrec.held && wrec.wakeupPhoto);
      if(!wakeupDone){ toast('먼저 기상 인증(STEP 1)을 완료해주세요'); input.value=''; return; }
    }
    if(!firebaseReady){ toast('⚠️ 지금은 임시 저장 모드예요 — 이 사진은 새로고침하면 사라져요!'); }
    const origKB = Math.round(file.size/1024);
    toast('사진 압축 중...');
    try{
      const dataUrl = isCam ? await stampImage(file, shotAt) : await compressImage(file);
      if(prefix==='wakeup') wakeupPhotoData = dataUrl; else activityPhotoData = dataUrl;
      const tf = timeFieldId ? document.getElementById(timeFieldId) : null;
      /* 카메라: 찍은 순간 시각 / 갤러리: 1순위 EXIF 촬영 시각 → 2순위 파일 시각 */
      let detected = '', timeSource = '';
      const exifTime = isCam ? null : await readExifTime(file);
      if(isCam){ detected = pad(shotAt.getHours())+':'+pad(shotAt.getMinutes()); timeSource = '촬영시각'; }
      else if(exifTime){ detected = exifTime; timeSource = '촬영정보'; }
      else {
        const lm = new Date(file.lastModified);
        if(lm && !isNaN(lm)){ detected = pad(lm.getHours())+':'+pad(lm.getMinutes()); timeSource = '파일시간'; }
      }
      if(tf && detected) tf.value = detected;
      /* 업로드 즉시 저장소에 영구 저장 → 페이지를 나갔다 와도 당일 사진이 유지됨 */
      let rec = getCheckin(member.id, ds);
      if(!rec){ rec = {id:'c_'+Date.now(), memberId:member.id, date:ds, held:false}; checkins.push(rec); }
      const photoKey = 'gt:photo:'+rec.id+':'+prefix;
      if(prefix==='wakeup'){
        rec.wakeupPhotoKey = photoKey; rec.wakeupPhoto = true;
        /* 기상 인증 사진에 타임스탬프가 감지되면, "인증 저장" 버튼을 누르지 않아도
           그 시간으로 바로 인증 완료 처리한다 (버튼은 이후 사진 재첨부·수정용으로만 필요) */
        if(detected){ rec.wakeupTime = detected; rec.held = false; }
      }
      else {
        rec.activityPhotoKey = photoKey; rec.activityPhoto = true;
        /* 모닝루틴 사진은 '업로드한 시각'을 인증 시각으로 기록.
           단, 해빗트래커 체크로 이미 인증된 시각이 있으면 체크 기준을 우선 적용 */
        const uploadedAt = nowHM();
        rec.activityTime = routineCertifiedTime(member, ds, rec.wakeupTime || '') || uploadedAt;
      }
      const okPhoto = await savePhoto(photoKey, dataUrl, member.id);
      await saveCheckins();
      if(!okPhoto){ toast('⚠️ 사진 저장에 실패했어요. 인터넷 연결을 확인하고 다시 올려주세요'); return; }
      box.innerHTML = savedPhotoHtml(dataUrl) + (isCam ? `<button type="button" class="save-gal-btn">💾 내 갤러리에 저장하기</button>` : '');
      bindSaved(dataUrl);
      box.querySelector('.save-gal-btn')?.addEventListener('click', ()=> savePhotoToGallery(dataUrl));
      /* 기록·캘린더·대시보드에도 즉시 반영 (체크인 화면은 유지) */
      renderHistory(); renderCalendar(); renderDashboard(); renderHero();
      if(prefix==='wakeup'){ refreshCheckinStatusPill(member, ds); if(window.__gmRefreshRoutine) window.__gmRefreshRoutine(); setTimeout(()=>{ if(window.__gmPomoExpand) window.__gmPomoExpand(); }, 300); }
      if(prefix==='activity' && window.__refreshRoutineStatus) window.__refreshRoutineStatus(); /* ✅ 인증 완료 표시 즉시 갱신 */
      const newKB = dataUrlSizeKB(dataUrl);
      toast(`사진 저장 완료 (${origKB}KB→${newKB}KB)${timeSource? ' · '+timeSource+'로 시간 자동입력·자동저장':''}`);
      /* 3단계: 백그라운드에서 사진 속 타임스탬프 글자를 OCR로 읽어 보정 — 기상 사진에만 적용
         (모닝루틴 사진은 '업로드한 시각' 기준이므로 사진 속 시간으로 덮어쓰지 않음) */
      if(prefix==='wakeup' && !isCam) ocrTimeFromImage(dataUrl).then(async t=>{
        if(!t) return;
        const stillSame = wakeupPhotoData === dataUrl;
        if(!stillSame) return; // 그 사이 다른 사진으로 바뀌었으면 무시
        if(tf && tf.value !== t){
          tf.value = t;
          /* OCR로 보정된 시간도 버튼 없이 바로 자동저장 */
          const rec2 = getCheckin(member.id, ds);
          if(rec2){
            rec2.wakeupTime = t; rec2.held = false;
            await saveCheckins();
            renderHistory(); renderCalendar(); renderDashboard(); renderHero();
            refreshCheckinStatusPill(member, ds);
          }
          toast(`📷 사진 속 타임스탬프(${t})를 읽어 시간을 보정했어요 (자동저장됨)`);
        }
      });
    }catch(err){
      console.error(err);
      toast('사진을 처리하지 못했어요. 다시 시도해주세요');
    }
    e.target.value = '';
  };
  input.addEventListener('change', onPick);
  camInput?.addEventListener('change', onPick);
}

/* ---- 모닝루틴 해빗트래커 ---- */
function memberGoals(member){
  if(Array.isArray(member.goals) && member.goals.length===3) return member.goals;
  return [member.goal||'', '', ''];
}
function nowHM(){ const n=new Date(); return pad(n.getHours())+':'+pad(n.getMinutes()); }
/* 현재 시각이 기상시간 기준 몇 분 뒤인지 (기상시간 미입력이면 null) */
function minutesSinceWake(wakeTime){
  const w = timeToMinutes(wakeTime); if(w==null) return null;
  const n = new Date();
  return (n.getHours()*60+n.getMinutes()) - w;
}
/* 모닝루틴 인증 창의 시작(하한)과 끝(상한)을 계산.
   하한은 항상 '실제 기상시간 +30분' (다시 잠들지 않도록 하는 최소 대기시간, 예외 없음)
   상한은 보통 '실제 기상시간 +60분'이지만, 목표시간보다 일찍 일어난 경우는
   '목표 기상시간 +60분'까지로 늘어나요 (일찍 일어난 만큼 인증할 시간도 넉넉하게). */
function routineWindow(wakeTime, targetTime){
  const w = timeToMinutes(wakeTime); if(w==null) return null;
  const t = timeToMinutes(targetTime);
  const isEarly = (t!=null && w < t);
  const min = w + 30;
  const max = isEarly ? t + 60 : w + 60;
  return { ref: w, min, max, isEarly };
}
function minutesNow_(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
/* 인증 성공 시각 계산: 작성된 목표 중 1개 이상 체크됐고, 그 마지막 체크가 인증 창(기상 또는 목표시간 기준) 안이면 그 시각 반환 */
function routineCertifiedTime(member, ds, wakeTime){
  const rec = getCheckin(member.id, ds);
  const checks = rec && rec.routineChecks;
  if(!checks || !wakeTime) return null;
  const goals = memberGoals(member).map((g,i)=>({g,i})).filter(x=>x.g.trim());
  if(goals.length===0) return null;
  const checkedGoals = goals.filter(x=> checks[x.i] && checks[x.i].done);
  if(checkedGoals.length===0) return null; // 3개 중 1개만 체크해도 인증 완료
  const times = checkedGoals.map(x=>timeToMinutes(checks[x.i].time)).filter(t=>t!=null);
  if(times.length===0) return null;
  const last = Math.max(...times);
  const win = routineWindow(wakeTime, member.targetTime); if(!win) return null;
  if(last >= win.min && last <= win.max){
    return pad(Math.floor(last/60))+':'+pad(last%60);
  }
  return null;
}
/* ===================== 폰 캘린더/알람 등록(.ics) =====================
   앱을 꺼두면 브라우저는 알림을 못 띄우기 때문에, 휴대폰 기본 캘린더에
   "알림이 있는 일정"을 등록해주는 방식으로 확실하게 알려준다. */
function icsStamp(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'; }
function icsLocal(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
function icsEscape(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function buildIcsEvent(start, summary, desc, rrule){
  const uid = 'gm-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'@growmorning';
  return [
    'BEGIN:VEVENT',
    'UID:'+uid,
    'DTSTAMP:'+icsStamp(new Date()),
    'DTSTART:'+icsLocal(start),
    'DURATION:PT10M',
    rrule ? ('RRULE:'+rrule) : null,
    'SUMMARY:'+icsEscape(summary),
    'DESCRIPTION:'+icsEscape(desc),
    'BEGIN:VALARM',
    'TRIGGER:PT0M',
    'ACTION:DISPLAY',
    'DESCRIPTION:'+icsEscape(summary),
    'END:VALARM',
    'END:VEVENT'
  ].filter(Boolean).join('\r\n');
}
function downloadIcs(filename, events){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GrowMorning//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH']
    .concat(events).concat(['END:VCALENDAR']);
  try{
    const blob = new Blob([lines.join('\r\n')], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 2000);
    return true;
  }catch(e){ toast('알람 파일을 만들지 못했어요'); return false; }
}
/* 오늘 00:00 기준으로 '분'을 실제 시각으로 바꾼다 (24시를 넘으면 자동으로 다음날) */
function minutesToDateToday(min){ const d = new Date(); d.setHours(Math.floor(min/60), min%60, 0, 0); return d; }
function addTodayDeadlineAlarm(member, win){
  const now = new Date();
  const evs = [];
  const openAt = minutesToDateToday(win.min);
  const warnAt = minutesToDateToday(Math.max(win.min, win.max - 10));
  if(openAt > now) evs.push(buildIcsEvent(openAt, '🌱 모닝루틴 체크 시작!', '그로우모닝 앱을 열고 모닝루틴을 체크해주세요.', null));
  if(warnAt > now) evs.push(buildIcsEvent(warnAt, '🚨 모닝루틴 체크 마감 10분 전', '지금 체크하지 않으면 오늘 루틴 인증이 누적성공률에 반영되지 않아요.', null));
  if(evs.length === 0){ toast('오늘 인증 창은 이미 지났어요 — "🔁 매일 알림 받기"를 눌러주세요'); return; }
  if(downloadIcs('growmorning-alarm.ics', evs)) toast('⏰ 받은 파일을 열고 "추가"를 눌러주세요');
}
function addDailyRoutineAlarm(member){
  const t = timeToMinutes(member.targetTime);
  if(t == null){ toast('기상 목표시간이 설정되어 있지 않아요'); return; }
  let start = minutesToDateToday(t + 45); // 목표 기상 45분 뒤 = 인증 창 한가운데
  if(start <= new Date()) start = new Date(start.getTime() + 86400000);
  let count = 60;
  const pe = periodEndDate();
  if(pe){ count = Math.max(1, Math.min(120, Math.ceil((pe - start)/86400000) + 1)); }
  const ev = buildIcsEvent(start, '🌱 모닝루틴 체크 시간!',
    '그로우모닝 앱을 열고 모닝루틴을 체크해주세요. (기상 후 30~60분 안에 체크해야 인정돼요)',
    'FREQ=DAILY;COUNT='+count);
  if(downloadIcs('growmorning-daily-alarm.ics', [ev])) toast('🔁 받은 파일을 열고 "추가"를 눌러주세요');
}

/* ===== 화면 꺼짐 방지 (크롬·사파리 최신버전 지원, https 주소에서만 작동) ===== */
let __gmWakeLock = null;
async function keepScreenOn(){
  if(__gmWakeLock || !('wakeLock' in navigator) || document.visibilityState!=='visible') return;
  try{
    __gmWakeLock = await navigator.wakeLock.request('screen');
    __gmWakeLock.addEventListener('release', ()=>{ __gmWakeLock = null; });
  }catch(e){ __gmWakeLock = null; }
}
function releaseScreenOn(){ if(__gmWakeLock){ try{ __gmWakeLock.release(); }catch(e){} __gmWakeLock = null; } }
let __gmAudioCtx = null;
function gmAudio(){
  try{
    if(!__gmAudioCtx){ __gmAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(__gmAudioCtx.state === 'suspended') __gmAudioCtx.resume();
  }catch(e){}
  return __gmAudioCtx;
}
/* 화면을 터치할 때마다 소리 장치를 깨워둠 (안드로이드 크롬은 터치 없이 소리 재생을 막음) */
['pointerdown','touchstart','click','keydown'].forEach(ev=>{
  document.addEventListener(ev, ()=>{
    const ctx = gmAudio();
    /* 무음 한 번 재생으로 소리 장치 활성화 */
    try{ const o=ctx.createOscillator(), g=ctx.createGain(); g.gain.value=0.00001; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.02); }catch(e){}
  }, {passive:true, capture:true});
});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && __gmAudioCtx) gmAudio(); });
function pomoMuted(){ return !!document.getElementById('pomo-mute-check')?.checked; }
function pomoMuteKey(){ return 'gt:pomoMute:'+todayStr(); }
function pomoBeep(times){
  if(pomoMuted()) return;
  try{
    gmAudio();
    let t = __gmAudioCtx.currentTime;
    for(let i=0;i<times;i++){
      const osc = __gmAudioCtx.createOscillator(), gain = __gmAudioCtx.createGain();
      osc.type='sine'; osc.frequency.value=880;
      gain.gain.setValueAtTime(0.001,t);
      gain.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      osc.connect(gain); gain.connect(__gmAudioCtx.destination);
      osc.start(t); osc.stop(t+0.35);
      t += 0.45;
    }
  }catch(e){}
}
function pomoPianoMelody(){
  if(pomoMuted()) return;
  try{
    gmAudio();

/* ---- 사진에서 시간 자동 인식 ---- */
/* 1) EXIF 촬영 시각 읽기: 카메라로 찍은 JPEG 안에 기록된 '찍은 시각'을 꺼낸다 */
function readExifTime(file){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const buf = reader.result;
        const view = new DataView(buf);
        if(view.byteLength < 4 || view.getUint16(0) !== 0xFFD8){ resolve(null); return; } // JPEG가 아니면 스킵
        let offset = 2;
        while(offset < view.byteLength - 4){
          const marker = view.getUint16(offset);
          if((marker & 0xFF00) !== 0xFF00) break;
          const size = view.getUint16(offset+2);
          if(marker === 0xFFE1){ // APP1(EXIF) 구간에서 'YYYY:MM:DD HH:MM:SS' 패턴 탐색
            const bytes = new Uint8Array(buf, offset+4, Math.min(size, view.byteLength-offset-4));
            const str = new TextDecoder('latin1').decode(bytes);
            const m = str.match(/\d{4}:\d{2}:\d{2} ([01]\d|2[0-3]):([0-5]\d):\d{2}/);
            if(m){ resolve(m[1]+':'+m[2]); return; }
          }
          offset += 2 + size;
        }
      }catch(e){}
      resolve(null);
    };
    reader.onerror = ()=> resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 131072)); // EXIF는 파일 앞부분에 있으므로 128KB만 읽음
  });
}
/* 2) OCR: 사진 위에 찍힌 타임스탬프 글자(예: 06:15)를 직접 읽는다. 필요할 때만 라이브러리 로드 */
let tessLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoadPromise) return tessLoadPromise;
  tessLoadPromise = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res; s.onerror = ()=>{ tessLoadPromise=null; rej(new Error('OCR 라이브러리 로드 실패')); };
    document.head.appendChild(s);
  });
  return tessLoadPromise;
}
async function ocrTimeFromImage(dataUrl){
  try{
    await loadTesseract();
    const result = await Promise.race([
      Tesseract.recognize(dataUrl, 'eng'),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('OCR 시간 초과')), 25000))
    ]);
    const text = (result && result.data && result.data.text) || '';
    const ampm = /(오전|오후|AM|PM|am|pm)/.exec(text);
    const m = /([01]?\d|2[0-3])\s*[:;]\s*([0-5]\d)/.exec(text);
    if(!m) return null;
    let h = parseInt(m[1],10); const mm = m[2];
    if(ampm){
      const a = ampm[1].toLowerCase();
      if((a==='오후'||a==='pm') && h<12) h+=12;
      if((a==='오전'||a==='am') && h===12) h=0;
    }
    return String(h).padStart(2,'0')+':'+mm;
  }catch(e){ console.warn('OCR 실패:', e.message); return null; }
}
