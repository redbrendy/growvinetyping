<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>타자연습 – 선생님과 함께</title>
  <style>
    /* =============================================
       CLAUDE DESIGN SYSTEM – TOKENS
    ============================================= */
    :root {
      --cl-bg:          #F5F4EF;
      --cl-surface:     #FFFFFF;
      --cl-border:      #E8E5DC;
      --cl-text-primary:#1A1915;
      --cl-text-second: #6B6859;
      --cl-text-muted:  #A09D8F;
      --cl-accent:      #D97706;   /* warm amber – Claude brand */
      --cl-accent-soft: #FEF3C7;
      --cl-success:     #15803D;
      --cl-success-bg:  #DCFCE7;
      --cl-error:       #DC2626;
      --cl-error-bg:    #FEE2E2;
      --cl-shadow-sm:   0 1px 3px rgba(26,25,21,.08), 0 1px 2px rgba(26,25,21,.04);
      --cl-shadow-md:   0 4px 12px rgba(26,25,21,.10), 0 2px 4px rgba(26,25,21,.06);
      --cl-shadow-lg:   0 12px 32px rgba(26,25,21,.12), 0 4px 8px rgba(26,25,21,.06);
      --cl-radius-sm:   8px;
      --cl-radius-md:   14px;
      --cl-radius-lg:   22px;
      --cl-radius-xl:   32px;
      --font-sans:      'Noto Sans KR', 'Segoe UI', system-ui, sans-serif;
      --font-display:   'Noto Sans KR', system-ui, sans-serif;
    }
    /* =============================================
       RESET & BASE
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-sans);
      background: var(--cl-bg);
      color: var(--cl-text-primary);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* =============================================
       SCREENS
    ============================================= */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
      transition: opacity .3s ease, transform .3s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(.97); }
    /* =============================================
       TOP-BAR
    ============================================= */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: var(--cl-surface);
      border-bottom: 1.5px solid var(--cl-border);
      box-shadow: var(--cl-shadow-sm);
    }
    .topbar-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 700; color: var(--cl-text-primary);
      letter-spacing: -.4px;
    }
    .topbar-logo .logo-dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #fff;
    }
    .topbar-actions { display: flex; gap: 10px; }
    /* =============================================
       BUTTONS
    ============================================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 20px;
      border: none; border-radius: var(--cl-radius-md);
      font-family: var(--font-sans); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all .15s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary {
      background: var(--cl-text-primary); color: #fff;
      box-shadow: var(--cl-shadow-sm);
    }
    .btn-primary:hover { background: #2D2C28; }
    .btn-accent {
      background: var(--cl-accent); color: #fff;
      box-shadow: 0 2px 8px rgba(217,119,6,.30);
    }
    .btn-accent:hover { background: #B45309; }
    .btn-ghost {
      background: transparent; color: var(--cl-text-second);
      border: 1.5px solid var(--cl-border);
    }
    .btn-ghost:hover { background: var(--cl-border); }
    .btn-danger {
      background: #FEE2E2; color: var(--cl-error);
      border: 1.5px solid #FECACA;
    }
    .btn-danger:hover { background: #FECACA; }
    .btn-lg { padding: 16px 36px; font-size: 18px; border-radius: var(--cl-radius-lg); }
    .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: var(--cl-radius-sm); }
    .btn-icon {
      width: 40px; height: 40px; padding: 0;
      border-radius: var(--cl-radius-sm);
    }
    /* =============================================
       CARD
    ============================================= */
    .card {
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-lg);
      box-shadow: var(--cl-shadow-md);
      padding: 28px;
    }
    /* =============================================
       BADGE
    ============================================= */
    .badge {
      display: inline-flex; align-items: center;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .badge-accent { background: var(--cl-accent-soft); color: #92400E; }
    .badge-ko { background: #EDE9FE; color: #5B21B6; }
    .badge-en { background: #DBEAFE; color: #1E40AF; }
    /* =============================================
       HOME SCREEN
    ============================================= */
    #home-screen {
      padding-top: 60px;
      background: var(--cl-bg);
    }
    .home-inner {
      width: 100%; max-width: 680px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .home-hero {
      text-align: center; padding: 36px 24px;
      background: linear-gradient(145deg, #FFFBF0 0%, #FEF9EE 100%);
      border: 1.5px solid #F5E8C2;
      border-radius: var(--cl-radius-xl);
      box-shadow: var(--cl-shadow-md);
    }
    .home-hero .mascot { font-size: 64px; margin-bottom: 12px; display: block; }
    .home-hero h1 {
      font-size: 28px; font-weight: 800;
      color: var(--cl-text-primary); letter-spacing: -.6px; margin-bottom: 8px;
    }
    .home-hero p { font-size: 15px; color: var(--cl-text-second); line-height: 1.6; }
    .set-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    .set-card {
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-lg);
      padding: 20px 18px;
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: var(--cl-shadow-sm);
    }
    .set-card:hover, .set-card:active {
      border-color: var(--cl-accent);
      box-shadow: 0 0 0 3px rgba(217,119,6,.12), var(--cl-shadow-md);
      transform: translateY(-2px);
    }
    .set-card .set-icon { font-size: 32px; margin-bottom: 10px; }
    .set-card .set-name { font-size: 17px; font-weight: 700; color: var(--cl-text-primary); margin-bottom: 4px; }
    .set-card .set-meta { font-size: 13px; color: var(--cl-text-muted); }
    .empty-state {
      text-align: center; padding: 40px 20px;
      background: var(--cl-surface); border: 1.5px dashed var(--cl-border);
      border-radius: var(--cl-radius-lg);
      color: var(--cl-text-muted); font-size: 15px;
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    /* =============================================
       PRACTICE SCREEN
    ============================================= */
    #practice-screen { padding-top: 60px; justify-content: flex-start; overflow-y: auto; }
    .practice-inner {
      width: 100%; max-width: 720px; margin: 0 auto;
      padding: 24px 0 40px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .progress-bar-wrap {
      background: var(--cl-border); border-radius: 999px;
      height: 8px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cl-accent), #F59E0B);
      border-radius: 999px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--cl-text-muted); margin-bottom: 6px;
    }
    .word-display-card {
      background: linear-gradient(145deg, #FFFBF0, #FFFDF8);
      border: 2px solid #F5E8C2;
      border-radius: var(--cl-radius-xl);
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--cl-shadow-md);
      position: relative;
      overflow: hidden;
    }
    .word-display-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--cl-accent), #F59E0B, #FCD34D);
    }
    .word-lang-badge { margin-bottom: 16px; }
    .word-target {
      font-size: 52px; font-weight: 900;
      color: var(--cl-text-primary); letter-spacing: -.5px;
      min-height: 72px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .word-hint { font-size: 14px; color: var(--cl-text-muted); }
    /* Character-by-character display */
    .char-row {
      display: flex; justify-content: center; align-items: center;
      gap: 4px; flex-wrap: wrap;
    }
    .char {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; height: 56px;
      border-radius: var(--cl-radius-sm);
      font-size: 36px; font-weight: 800;
      transition: all .15s ease;
    }
    .char-idle { color: var(--cl-text-muted); background: transparent; }
    .char-correct { color: var(--cl-success); background: var(--cl-success-bg); }
    .char-error { color: var(--cl-error); background: var(--cl-error-bg); }
    .char-active {
      color: var(--cl-text-primary); background: var(--cl-accent-soft);
      box-shadow: 0 0 0 2px var(--cl-accent);
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { box-shadow: 0 0 0 2px var(--cl-accent); }
      50%       { box-shadow: 0 0 0 2px transparent; }
    }
    /* Input area */
    .input-section {
      display: flex; flex-direction: column; gap: 12px;
    }
    .input-label { font-size: 14px; font-weight: 600; color: var(--cl-text-second); }
    .typing-input-wrap { position: relative; }
    .typing-input {
      width: 100%; padding: 18px 20px;
      font-family: var(--font-sans); font-size: 22px; font-weight: 600;
      color: var(--cl-text-primary);
      background: var(--cl-surface);
      border: 2px solid var(--cl-border);
      border-radius: var(--cl-radius-md);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      text-align: center; letter-spacing: 2px;
      caret-color: var(--cl-accent);
    }
    .typing-input:focus {
      border-color: var(--cl-accent);
      box-shadow: 0 0 0 3px rgba(217,119,6,.15);
    }
    .typing-input.input-ok  { border-color: var(--cl-success); background: var(--cl-success-bg); }
    .typing-input.input-err { border-color: var(--cl-error);   background: var(--cl-error-bg);   }
    .input-shake { animation: shake .3s ease; }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-8px); }
      40%{ transform: translateX(8px); }
      60%{ transform: translateX(-6px); }
      80%{ transform: translateX(6px); }
    }
    /* Stats bar */
    .stats-bar {
      display: flex; gap: 14px;
    }
    .stat-chip {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 14px 10px;
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-md);
      box-shadow: var(--cl-shadow-sm);
    }
    .stat-chip .stat-val {
      font-size: 22px; font-weight: 800; color: var(--cl-text-primary);
    }
    .stat-chip .stat-lbl {
      font-size: 12px; color: var(--cl-text-muted); margin-top: 2px;
    }
    /* Result overlay */
    .result-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(26,25,21,.55); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .result-overlay.show { opacity: 1; pointer-events: all; }
    .result-card {
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-xl);
      padding: 40px 32px;
      max-width: 420px; width: 100%;
      text-align: center;
      box-shadow: var(--cl-shadow-lg);
      transform: scale(.92); transition: transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    .result-overlay.show .result-card { transform: scale(1); }
    .result-emoji { font-size: 64px; margin-bottom: 16px; }
    .result-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .result-score { font-size: 15px; color: var(--cl-text-second); margin-bottom: 24px; }
    .result-actions { display: flex; gap: 12px; }
    /* =============================================
       ADMIN SCREEN
    ============================================= */
    #admin-screen { padding-top: 60px; overflow-y: auto; justify-content: flex-start; }
    .admin-inner {
      width: 100%; max-width: 760px; margin: 0 auto;
      padding: 28px 0 60px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .admin-section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--cl-text-muted); margin-bottom: 12px;
    }
    .form-row { display: flex; gap: 10px; }
    .form-input {
      flex: 1; padding: 12px 16px;
      font-family: var(--font-sans); font-size: 15px;
      color: var(--cl-text-primary);
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-md);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus {
      border-color: var(--cl-accent);
      box-shadow: 0 0 0 3px rgba(217,119,6,.12);
    }
    .form-select {
      padding: 12px 16px;
      font-family: var(--font-sans); font-size: 15px;
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-md);
      color: var(--cl-text-primary);
      outline: none; cursor: pointer;
    }
    .word-chip-list {
      display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px;
      padding: 12px; background: var(--cl-bg);
      border: 1.5px solid var(--cl-border); border-radius: var(--cl-radius-md);
    }
    .word-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      background: var(--cl-surface); border: 1.5px solid var(--cl-border);
      border-radius: 999px; font-size: 14px; font-weight: 600;
      color: var(--cl-text-primary);
    }
    .word-chip .chip-del {
      background: none; border: none; cursor: pointer;
      color: var(--cl-text-muted); font-size: 15px; line-height: 1;
      padding: 0; transition: color .1s;
    }
    .word-chip .chip-del:hover { color: var(--cl-error); }
    .set-list-item {
      display: flex; align-items: center;
      padding: 16px 20px;
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-md);
      box-shadow: var(--cl-shadow-sm);
      gap: 14px;
    }
    .set-list-item .sli-icon { font-size: 28px; flex-shrink: 0; }
    .set-list-item .sli-body { flex: 1; min-width: 0; }
    .set-list-item .sli-name { font-size: 15px; font-weight: 700; }
    .set-list-item .sli-words { font-size: 13px; color: var(--cl-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .set-list-item .sli-actions { display: flex; gap: 8px; flex-shrink: 0; }
    /* =============================================
       PASSWORD MODAL
    ============================================= */
    .modal-bg {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(26,25,21,.55); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-bg.show { opacity: 1; pointer-events: all; }
    .modal-box {
      background: var(--cl-surface);
      border: 1.5px solid var(--cl-border);
      border-radius: var(--cl-radius-xl);
      padding: 36px 28px;
      max-width: 360px; width: 100%;
      box-shadow: var(--cl-shadow-lg);
      text-align: center;
      transform: scale(.92); transition: transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    .modal-bg.show .modal-box { transform: scale(1); }
    .modal-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .modal-box p  { font-size: 14px; color: var(--cl-text-second); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-error { font-size: 13px; color: var(--cl-error); margin-top: 8px; min-height: 18px; }
    /* =============================================
       TOAST
    ============================================= */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(16px);
      z-index: 500;
      background: var(--cl-text-primary); color: #fff;
      padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      box-shadow: var(--cl-shadow-lg);
      opacity: 0; transition: all .3s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* =============================================
       CONFETTI CANVAS
    ============================================= */
    #confetti-canvas {
      position: fixed; inset: 0; z-index: 150;
      pointer-events: none;
    }
    /* =============================================
       SYNC BADGE
    ============================================= */
    #sync-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--cl-text-muted);
      padding: 4px 10px; border-radius: 999px; background: var(--cl-bg);
      border: 1px solid var(--cl-border);
    }
    #sync-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cl-text-muted); }
    #sync-badge.online .dot { background: var(--cl-success); }
    #sync-badge.online { color: var(--cl-success); }
    #sync-badge.offline .dot { background: var(--cl-error); }
    #sync-badge.offline { color: var(--cl-error); }
    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (max-width: 540px) {
      .set-grid { grid-template-columns: 1fr; }
      .word-target { font-size: 40px; }
      .char { font-size: 28px; min-width: 36px; height: 44px; }
      .stats-bar { gap: 8px; }
      .form-row { flex-direction: column; }
      .result-actions { flex-direction: column; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- ═══════════════════════════════════
       FIREBASE SDK (모든 기기가 공유하는 저장소)
  ═══════════════════════════════════ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<!-- ═══════════════════════════════════
     TOP BAR
═══════════════════════════════════ -->
<header class="topbar">
  <div class="topbar-logo">
    <div class="logo-dot">⌨</div>
    <span>타자연습</span>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="sync-badge"><span class="dot"></span><span id="sync-badge-text">연결 중…</span></span>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
</header>
<!-- ═══════════════════════════════════
     HOME SCREEN
═══════════════════════════════════ -->
<section class="screen" id="home-screen">
  <div class="home-inner">
    <div class="home-hero">
      <span class="mascot">🐣</span>
      <h1>오늘도 타자 연습해요!</h1>
      <p>선생님이 만든 단어 세트를 골라서 시작해요 ✨</p>
    </div>
    <div id="set-grid-container"></div>
  </div>
</section>
<!-- ═══════════════════════════════════
     PRACTICE SCREEN
═══════════════════════════════════ -->
<section class="screen hidden" id="practice-screen">
  <div class="practice-inner">
    <!-- 진행 -->
    <div>
      <div class="progress-label">
        <span id="progress-text">0 / 0 단어</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <!-- 단어 카드 -->
    <div class="word-display-card">
      <div class="word-lang-badge" id="word-lang-badge"></div>
      <div class="word-target" id="word-target">
        <div class="char-row" id="char-row"></div>
      </div>
      <div class="word-hint" id="word-hint"></div>
    </div>
    <!-- 통계 -->
    <div class="stats-bar">
      <div class="stat-chip">
        <span class="stat-val" id="stat-correct">0</span>
        <span class="stat-lbl">✅ 정답</span>
      </div>
      <div class="stat-chip">
        <span class="stat-val" id="stat-wrong">0</span>
        <span class="stat-lbl">❌ 오답</span>
      </div>
      <div class="stat-chip">
        <span class="stat-val" id="stat-acc">-</span>
        <span class="stat-lbl">🎯 정확도</span>
      </div>
    </div>
    <!-- 입력 -->
    <div class="input-section">
      <div class="input-label">✏️ 아래에 단어를 입력하세요</div>
      <div class="typing-input-wrap">
        <input class="typing-input" id="typing-input"
          type="text" autocomplete="off" autocorrect="off"

<!-- ═══════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════ -->
<script>
/* ============================================================
   FIREBASE 설정
   ▼▼▼ 아래 firebaseConfig 안의 값들을 Firebase 콘솔에서 복사한
        내용으로 통째로 교체하세요 (7개 값 전부) ▼▼▼
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCYwf_ofk44T7RkIxeudlVpLZX2wptEkV0",
  authDomain: "growvine-typing.firebaseapp.com",
  databaseURL: "https://growvine-typing-default-rtdb.firebaseio.com",
  projectId: "growvine-typing",
  storageBucket: "growvine-typing.firebasestorage.app",
  messagingSenderId: "270361921671",
  appId: "1:270361921671:web:31f6c8b646051a9906d022"
};

let db, setsRef;
let firebaseReady = false;

function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    setsRef = db.ref('sets');
    firebaseReady = true;
    setSyncBadge('connecting');
  } catch (err) {
    console.error('Firebase 초기화 실패:', err);
    setSyncBadge('offline');
  }
}

function setSyncBadge(state) {
  const badge = document.getElementById('sync-badge');
  const text  = document.getElementById('sync-badge-text');
  if (!badge) return;
  badge.classList.remove('online', 'offline');
  if (state === 'online') {
    badge.classList.add('online');
    text.textContent = '실시간 동기화 중';
  } else if (state === 'offline') {
    badge.classList.add('offline');
    text.textContent = '연결 안 됨 (설정 확인)';
  } else {
    text.textContent = '연결 중…';
  }
}

/* ============================================================
   STATE
============================================================ */
let sets        = [];
let currentSet  = null;
let words       = [];
let wordIndex   = 0;
let correct     = 0;
let wrong       = 0;
let activeScreen = 'home';
// admin form temp
let draftWords  = [];

const DEFAULT_SETS = [
  {
    id: 'default_ko', name: '기본 한글 낱말', lang: 'ko', icon: '📚',
    words: ['사과','바나나','포도','딸기','수박','나비','강아지','고양이']
  },
  {
    id: 'default_en', name: 'Basic English', lang: 'en', icon: '🍎',
    words: ['apple','banana','cat','dog','sun','moon','star','fish']
  }
];

/* ============================================================
   PERSISTENCE (Firebase Realtime Database — 모든 기기 공유)
============================================================ */
function saveSets() {
  if (!firebaseReady) {
    showToast('⚠️ 서버에 연결되지 않아 저장할 수 없어요');
    return;
  }
  setsRef.set(sets).catch(err => {
    console.error('저장 실패:', err);
    showToast('⚠️ 저장 중 오류가 발생했어요');
  });
}

// 실시간으로 다른 기기의 변경사항을 계속 구독합니다.
function listenForSets() {
  setsRef.on('value', snapshot => {
    setSyncBadge('online');
    const data = snapshot.val();
    if (data) {
      sets = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
    } else {
      // 데이터베이스가 비어있으면 기본 세트를 한 번 심어줍니다.
      sets = [...DEFAULT_SETS];
      setsRef.set(sets);
    }
    // 현재 보고 있는 화면을 최신 데이터로 다시 그려줍니다.
    if (activeScreen === 'home') renderHome();
    if (activeScreen === 'admin') renderAdminSetList();
  }, err => {
    console.error('불러오기 실패:', err);
    setSyncBadge('offline');
  });
}
/* ============================================================
   SCREEN NAVIGATION
============================================================ */
function showScreen(name) {
  ['home','practice','admin'].forEach(s => {
    const el = document.getElementById(`${s}-screen`);
    el.classList.toggle('hidden', s !== name);
  });
  activeScreen = name;
  renderTopbar();
}
function renderTopbar() {
  const el = document.getElementById('topbar-actions');
  if (activeScreen === 'home') {
    el.innerHTML = `<button class="btn btn-ghost" id="btn-go-admin">⚙️ 관리자</button>`;
    document.getElementById('btn-go-admin').addEventListener('click', openAdminModal);
  } else if (activeScreen === 'practice') {
    el.innerHTML = `<button class="btn btn-ghost" id="btn-go-home">← 나가기</button>`;
    document.getElementById('btn-go-home').addEventListener('click', () => { showScreen('home'); renderHome(); });
  } else if (activeScreen === 'admin') {
    el.innerHTML = `<button class="btn btn-ghost" id="btn-go-home-admin">← 돌아가기</button>`;
    document.getElementById('btn-go-home-admin').addEventListener('click', () => { showScreen('home'); renderHome(); });
  }
}
/* ============================================================
   HOME
============================================================ */
function renderHome() {
  const container = document.getElementById('set-grid-container');
  if (!firebaseReady) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔌</div>
        서버에 연결하는 중이에요…
      </div>`;
    return;
  }
  if (sets.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📂</div>
        아직 단어 세트가 없어요!<br>관리자 모드에서 세트를 만들어 주세요.
      </div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'set-grid';
  sets.forEach(s => {
    const card = document.createElement('div');
    card.className = 'set-card';
    card.innerHTML = `
      <div class="set-icon">${s.icon || (s.lang === 'ko' ? '📘' : '📗')}</div>
      <div class="set-name">${s.name}</div>
      <div class="set-meta">${s.lang === 'ko' ? '🇰🇷 한글' : '🇺🇸 영어'} · ${s.words.length}단어</div>`;
    card.addEventListener('click', () => startPractice(s));
    grid.appendChild(card);
  });
  container.innerHTML = '';
  container.appendChild(grid);
}
/* ============================================================
   PRACTICE
============================================================ */
function startPractice(set) {
  currentSet = set;
  words      = [...set.words].sort(() => Math.random() - .5);
  wordIndex  = 0;
  correct    = 0;
  wrong      = 0;
  showScreen('practice');
  updateStats();
  loadWord();
  setTimeout(() => document.getElementById('typing-input').focus(), 300);
}
function loadWord() {
  if (wordIndex >= words.length) { showResult(); return; }
  const word = words[wordIndex];
  const isKo = currentSet.lang === 'ko';
  // Badge
  const badge = document.getElementById('word-lang-badge');
  badge.innerHTML = `<span class="badge ${isKo ? 'badge-ko' : 'badge-en'}">${isKo ? '🇰🇷 한글' : '🇺🇸 영어'}</span>`;
  // Char row
  const row = document.getElementById('char-row');
  row.innerHTML = '';
  [...word].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = `char ${i === 0 ? 'char-active' : 'char-idle'}`;
    span.dataset.idx = i;
    span.textContent = ch;
    row.appendChild(span);
  });
  // Hint
  document.getElementById('word-hint').textContent =
    isKo ? `"${word}"을(를) 입력하세요` : `Type "${word}"`;
  // Input clear
  const inp = document.getElementById('typing-input');
  inp.value = '';
  inp.className = 'typing-input';
  inp.placeholder = isKo ? '한글로 입력하세요…' : 'Type in English…';
  // Progress
  const pct = Math.round((wordIndex / words.length) * 100);
  document.getElementById('progress-text').textContent = `${wordIndex} / ${words.length} 단어`;
  document.getElementById('progress-pct').textContent  = `${pct}%`;
  document.getElementById('progress-fill').style.width = `${pct}%`;
}
function updateCharDisplay(typed) {
  const word  = words[wordIndex];
  const chars = document.querySelectorAll('#char-row .char');
  chars.forEach((span, i) => {
    if (i < typed.length) {
      span.className = `char ${typed[i] === word[i] ? 'char-correct' : 'char-error'}`;
    } else if (i === typed.length) {
      span.className = 'char char-active';
    } else {
      span.className = 'char char-idle';
    }
  });
}
function submitWord() {
  const inp  = document.getElementById('typing-input');
  const typed = inp.value.trim();
  const word  = words[wordIndex];
  if (typed === '') return;
  if (typed === word) {
    // 정답
    correct++;
    inp.classList.add('input-ok');
    updateStats();
    wordIndex++;
    setTimeout(() => { loadWord(); }, 480);
  } else {
    // 오답
    wrong++;
    inp.classList.add('input-err');
    inp.classList.add('input-shake');
    updateStats();
    setTimeout(() => {
      inp.classList.remove('input-err', 'input-shake');
      inp.value = '';
    }, 600);
  }
}
function skipWord() {
  wrong++;
  wordIndex++;
  updateStats();
  loadWord();
}
function updateStats() {
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent   = wrong;
  const total = correct + wrong;
  document.getElementById('stat-acc').textContent = total > 0
    ? Math.round((correct / total) * 100) + '%' : '-';
}
/* ============================================================
   RESULT
============================================================ */
function showResult() {
  const total = words.length;
  const pct   = Math.round((correct / total) * 100);
  let emoji = '😊', title = '잘 했어요!';
  if (pct === 100) { emoji = '🏆'; title = '완벽해요! 👏'; launchConfetti(); }
  else if (pct >= 80) { emoji = '🎉'; title = '아주 잘 했어요!'; }
  else if (pct >= 60) { emoji = '😊'; title = '잘 했어요!'; }
  else { emoji = '💪'; title = '다시 도전해봐요!'; }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-score').textContent =
    `${total}개 중 ${correct}개 정답 (정확도 ${pct}%)`;
  // Progress 100%
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-pct').textContent  = '100%';
  document.getElementById('progress-text').textContent = `${total} / ${total} 단어`;
  document.getElementById('result-overlay').classList.add('show');
}
/* ============================================================
   ADMIN
============================================================ */
function openAdminModal() {
  document.getElementById('admin-pw-input').value = '';
  document.getElementById('admin-pw-error').textContent = '';
  document.getElementById('admin-pw-modal').classList.add('show');
  setTimeout(() => document.getElementById('admin-pw-input').focus(), 200);
}
function checkAdminPassword() {
  const val = document.getElementById('admin-pw-input').value;
  if (val === ADMIN_PASSWORD) {
    document.getElementById('admin-pw-modal').classList.remove('show');
    showScreen('admin');
    renderAdmin();
  } else {
    document.getElementById('admin-pw-error').textContent = '비밀번호가 틀렸어요. 다시 시도해 주세요.';
    document.getElementById('admin-pw-input').value = '';
    document.getElementById('admin-pw-input').focus();
  }
}
function renderAdmin() {
  renderAdminSetList();
  resetAdminForm();
}
function renderAdminSetList() {
  const list = document.getElementById('admin-set-list');
  if (sets.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div>저장된 세트가 없어요.</div>`;
    return;
  }
  list.innerHTML = '';
  sets.forEach(s => {
    const item = document.createElement('div');
    item.className = 'set-list-item';
    item.innerHTML = `
      <div class="sli-icon">${s.icon || '📘'}</div>
      <div class="sli-body">
        <div class="sli-name">${s.name}
          <span class="badge ${s.lang === 'ko' ? 'badge-ko' : 'badge-en'}" style="margin-left:6px;">${s.lang === 'ko' ? '한글' : 'EN'}</span>
        </div>
        <div class="sli-words">${s.words.join('  ·  ')}</div>
      </div>
      <div class="sli-actions">
        <button class="btn btn-ghost btn-sm" data-edit="${s.id}">✏️ 수정</button>
        <button class="btn btn-danger btn-sm" data-del="${s.id}">🗑 삭제</button>
      </div>`;
    list.appendChild(item);
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.del;
      if (confirm('이 세트를 삭제할까요?')) {
        sets = sets.filter(s => s.id !== id);
        saveSets();
        showToast('세트가 삭제됐어요 🗑');
      }
    });
  });
  list.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id  = btn.dataset.edit;
      const set = sets.find(s => s.id === id);
      if (!set) return;
      document.getElementById('admin-set-name').value  = set.name;
      document.getElementById('admin-set-lang').value  = set.lang;
      document.getElementById('admin-set-icon').value  = set.icon || '';
      draftWords = [...set.words];
      renderDraftChips();
      // 버튼 레이블 변경
      document.getElementById('btn-save-set').textContent = '💾 세트 업데이트';
      document.getElementById('btn-save-set').dataset.editId = id;
      document.getElementById('admin-set-name').focus();
      showToast('세트를 수정 중이에요 ✏️');
    });
  });
}
function resetAdminForm() {
  document.getElementById('admin-set-name').value  = '';
  document.getElementById('admin-set-lang').value  = 'ko';
  document.getElementById('admin-set-icon').value  = '';
  document.getElementById('admin-word-input').value = '';
  draftWords = [];
  renderDraftChips();
  const saveBtn = document.getElementById('btn-save-set');
  saveBtn.textContent = '💾 세트 저장';
  delete saveBtn.dataset.editId;
}
function addDraftWord() {
  const inp = document.getElementById('admin-word-input');
  const w   = inp.value.trim();
  if (!w) return;
  if (draftWords.includes(w)) {
    showToast('이미 있는 단어예요!'); inp.value = ''; return;
  }
  draftWords.push(w);
  renderDraftChips();
  inp.value = '';
  inp.focus();
}
function renderDraftChips() {
  const wrap = document.getElementById('admin-word-chips');
  if (draftWords.length === 0) {
    wrap.innerHTML = `<span style="color:var(--cl-text-muted);font-size:13px;align-self:center;">단어를 추가하면 여기에 표시돼요</span>`;
    return;
  }
  wrap.innerHTML = '';
  draftWords.forEach((w, i) => {
    const chip = document.createElement('div');
    chip.className = 'word-chip';
    chip.innerHTML = `${w}<button class="chip-del" data-i="${i}">×</button>`;
    wrap.appendChild(chip);
  });
  wrap.querySelectorAll('.chip-del').forEach(btn => {
    btn.addEventListener('click', () => {
      draftWords.splice(Number(btn.dataset.i), 1);
      renderDraftChips();
    });
  });
}
function saveSet() {
  if (!firebaseReady) {
    showToast('⚠️ 서버에 연결되지 않아 저장할 수 없어요');
    return;
  }
  const name = document.getElementById('admin-set-name').value.trim();
  const lang = document.getElementById('admin-set-lang').value;
  const icon = document.getElementById('admin-set-icon').value.trim() || (lang === 'ko' ? '📘' : '📗');
  const editId = document.getElementById('btn-save-set').dataset.editId;
  if (!name) { showToast('세트 이름을 입력해 주세요!'); return; }
  if (draftWords.length === 0) { showToast('단어를 1개 이상 추가해 주세요!'); return; }
  if (editId) {
    const idx = sets.findIndex(s => s.id === editId);
    if (idx !== -1) {
      sets[idx] = { ...sets[idx], name, lang, icon, words: [...draftWords] };
      showToast('세트가 업데이트됐어요 ✅');
    }
  } else {
    sets.push({
      id:    `set_${Date.now()}`,
      name, lang, icon,
      words: [...draftWords]
    });
    showToast('새 세트가 저장됐어요 🎉');
  }
  saveSets();
  resetAdminForm();
}
/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
/* ============================================================
   CONFETTI
============================================================ */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 6 + 3,
    color: ['#D97706','#F59E0B','#FCD34D','#34D399','#60A5FA','#F87171','#A78BFA'][Math.floor(Math.random()*7)],
    rot: Math.random() * 360,
    vx: (Math.random() - .5) * 3,
    vy: Math.random() * 4 + 2,
    vr: (Math.random() - .5) * 8,
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}
/* ============================================================
   EVENT BINDING
============================================================ */
const ADMIN_PASSWORD = '1234';   // ← 원하는 비밀번호로 변경

function bindEvents() {
  // typing input - real-time char display
  document.getElementById('typing-input').addEventListener('input', e => {
    updateCharDisplay(e.target.value);
  });
  // Enter key submit
  document.getElementById('typing-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitWord();
  });
  document.getElementById('btn-submit').addEventListener('click', submitWord);
  document.getElementById('btn-skip').addEventListener('click', skipWord);
  // result
  document.getElementById('btn-result-home').addEventListener('click', () => {
    document.getElementById('result-overlay').classList.remove('show');
    showScreen('home');
    renderHome();
  });
  document.getElementById('btn-result-retry').addEventListener('click', () => {
    document.getElementById('result-overlay').classList.remove('show');
    startPractice(currentSet);
  });
  // admin password modal
  document.getElementById('btn-pw-ok').addEventListener('click', checkAdminPassword);
  document.getElementById('btn-pw-cancel').addEventListener('click', () => {
    document.getElementById('admin-pw-modal').classList.remove('show');
  });
  document.getElementById('admin-pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkAdminPassword();
  });
  // admin form
  document.getElementById('btn-add-word').addEventListener('click', addDraftWord);
  document.getElementById('admin-word-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addDraftWord();
  });
  document.getElementById('btn-reset-form').addEventListener('click', resetAdminForm);
  document.getElementById('btn-save-set').addEventListener('click', saveSet);
}
/* ============================================================
   INIT
============================================================ */
renderHome();
renderTopbar();
bindEvents();
initFirebase();
if (firebaseReady) listenForSets();
</script>
